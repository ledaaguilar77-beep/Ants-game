<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema de Hormigas y Depredadores</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #151d13;
            color: #eef5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        header {
            text-align: center;
            margin-bottom: 8px;
        }
        h1 { font-size: 1.5rem; color: #a7c957; }
        #status-msg {
            font-size: 0.9rem;
            color: #f2e8cf;
            background: #386641;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
            font-weight: bold;
        }
        
        .hud {
            display: flex;
            gap: 12px;
            background: #23301f;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #4f6d45;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat { font-weight: bold; font-size: 0.95rem; }
        .stat span { color: #a7c957; }
        
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #4a7c36;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #6a994e; }
        button:active { transform: scale(0.95); }
        button.active {
            background-color: #bc4749;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        button:disabled {
            background-color: #3b4637;
            color: #788773;
            cursor: not-allowed;
        }
        .btn-action { background-color: #386641; }
        .btn-action:hover { background-color: #4a7c36; }
        .btn-danger { background-color: #9b2226; }
        .btn-danger:hover { background-color: #bc4749; }

        canvas {
            background-color: #43702f;
            border: 4px solid #273b20;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Ecosistema: Colonia de Hormigas vs Depredadores</h1>
        <div id="status-msg">🛠️ Herramienta seleccionada: Colocar Hormiguero</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida Global: <span id="food-count">40</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat">🏠 Nidos: <span id="nest-count">0</span></div>
        <button id="btn-spawn-ant" disabled>Crear Hormiga (10 🍓)</button>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Reiniciar Mapa</button>
    </div>

    <div class="toolbar">
        <button id="tool-nest" class="active" onclick="setTool('nest')">🏠 Colocar Hormiguero</button>
        <button id="tool-food" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="btn-action" onclick="setTool('spider')">🕷️ Invocar Araña</button>
        <button id="tool-mantis" class="btn-action" onclick="setTool('mantis')">🦗 Invocar Mantis</button>
        <button id="tool-termites" class="btn-action" onclick="setTool('termites')">🐜 Invocar Termitas</button>
    </div>

    <canvas id="gameCanvas" width="1200" height="750"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Elementos
        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const nestEl = document.getElementById('nest-count');
        const statusEl = document.getElementById('status-msg');
        const btnSpawn = document.getElementById('btn-spawn-ant');
        const btnSpeed = document.getElementById('btn-speed');

        // Estado del juego
        let currentTool = 'nest'; // 'nest', 'food', 'spider', 'mantis', 'termites'
        let storedFood = 40;
        let nests = [];
        let ants = [];
        let enemies = [];
        let foods = [];
        let pheromones = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        // Elementos del entorno
        let grassBlades = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');

            const names = {
                nest: "🏠 Colocar Hormiguero (Haz clic en el mapa)",
                food: "🍓 Soltar Comida (Haz clic para poner bayas)",
                spider: "🕷️ Invocar Araña (Depredador solitario y letal)",
                mantis: "🦗 Invocar Mantis (Cazador rápido y ágil)",
                termites: "🐜 Invocar Termitas (Colonia rival agresiva)"
            };
            statusEl.textContent = names[tool];
        }

        class Ant {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.9;
                this.hasFood = false;
                this.pheromoneTimer = 0;
            }

            update() {
                // Huir de enemigos cercanos si están muy cerca
                let fleeAngle = null;
                for (let en of enemies) {
                    let distToEn = Math.hypot(en.x - this.x, en.y - this.y);
                    if (distToEn < 70) {
                        fleeAngle = Math.atan2(this.y - en.y, this.x - en.x);
                        break;
                    }
                }

                if (fleeAngle !== null) {
                    this.angle = this.lerpAngle(this.angle, fleeAngle, 0.3);
                } else {
                    this.angle += (Math.random() - 0.5) * 0.45;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        this.pheromoneTimer++;
                        if (this.pheromoneTimer % 6 === 0) {
                            pheromones.push({ x: this.x, y: this.y, life: 350 });
                        }

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 2;
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        let foundTarget = false;
                        for (let i = foods.length - 1; i >= 0; i--) {
                            const f = foods[i];
                            const dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 70) {
                                const targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);
                                foundTarget = true;

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }

                        if (!foundTarget && pheromones.length > 0) {
                            let bestPheromone = null;
                            let maxLife = 0;

                            for (let p of pheromones) {
                                const dist = Math.hypot(p.x - this.x, p.y - this.y);
                                if (dist > 10 && dist < 60) {
                                    const angleToP = Math.atan2(p.y - this.y, p.x - this.x);
                                    const diff = Math.abs(this.normalizeAngle(angleToP - this.angle));
                                    if (diff < 1.1 && p.life > maxLife) {
                                        maxLife = p.life;
                                        bestPheromone = p;
                                    }
                                }
                            }

                            if (bestPheromone) {
                                const targetAngle = Math.atan2(bestPheromone.y - this.y, bestPheromone.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);
                            }
                        }
                    }
                }

                // Movimiento y colisión con rocas
                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + 4) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                // Limites
                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#2b120a';
                ctx.beginPath();
                ctx.ellipse(-4, 0, 3.2, 2.1, 0, 0, Math.PI * 2);
                ctx.ellipse(0, 0, 2.2, 1.5, 0, 0, Math.PI * 2);
                ctx.ellipse(3.5, 0, 2, 1.8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(6.5, 0, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'spider', 'mantis', 'termites'
                this.angle = Math.random() * Math.PI * 2;
                
                if (type === 'spider') {
                    this.speed = 1.3;
                    this.radius = 12;
                    this.color = '#1f1f1f';
                } else if (type === 'mantis') {
                    this.speed = 2.2;
                    this.radius = 10;
                    this.color = '#2d6a4f';
                } else { // termita
                    this.speed = 1.6;
                    this.radius = 8;
                    this.color = '#d4a373';
                }
            }

            update() {
                // Buscar la hormiga más cercana para cazarla
                let closestAnt = null;
                let minDist = 180;

                for (let ant of ants) {
                    let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                    if (d < minDist) {
                        minDist = d;
                        closestAnt = ant;
                    }
                }

                if (closestAnt) {
                    let targetAngle = Math.atan2(closestAnt.y - this.y, closestAnt.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);

                    // Si atrapa a la hormiga, la elimina
                    if (minDist < this.radius + 4) {
                        let index = ants.indexOf(closestAnt);
                        if (index > -1) ants.splice(index, 1);
                        updateUI();
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.4;
                }

                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;

                if (this.x < 20 || this.x > canvas.width - 20) this.angle = Math.PI - this.angle;
                if (this.y < 20 || this.y > canvas.height - 20) this.angle = -this.angle;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                if (this.type === 'spider') {
                    ctx.fillStyle = '#111';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                    // Ojos rojos
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(3, -4, 2, 2);
                    ctx.fillRect(3, 2, 2, 2);
                } else if (this.type === 'mantis') {
                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 10, 4, 0, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = '#b08968';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 7, 3.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];

            for (let i = 0; i < 800; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 4 + Math.random() * 6,
                    color: Math.random() > 0.5 ? '#3b6829' : '#4e8038'
                });
            }

            for (let i = 0; i < 12; i++) {
                rocks.push({
                    x: 80 + Math.random() * (canvas.width - 160),
                    y: 80 + Math.random() * (canvas.height - 160),
                    radius: 18 + Math.random() * 20
                });
            }

            const flowerColors = ['#ffbe0b', '#ff006e', '#ffffff', '#fb5607'];
            for (let i = 0; i < 60; i++) {
                flowers.push({
                    x: 30 + Math.random() * (canvas.width - 60),
                    y: 30 + Math.random() * (canvas.height - 60),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 10; i++) {
                const bx = 60 + Math.random() * (canvas.width - 120);
                const by = 60 + Math.random() * (canvas.height - 120);
                bushes.push({ x: bx, y: by, radius: 26 + Math.random() * 12 });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 45, by + (Math.random() - 0.5) * 45, 10);
            }

            for (let i = 0; i < 8; i++) {
                trees.push({
                    x: 90 + Math.random() * (canvas.width - 180),
                    y: 90 + Math.random() * (canvas.height - 180),
                    radius: 52 + Math.random() * 20
                });
            }
        }

        function init() {
            nests = [];
            ants = [];
            enemies = [];
            pheromones = [];
            storedFood = 40;
            generateEnvironment();
            updateUI();
            setTool('nest');
        }

        function placeNest(x, y) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, y - rock.y) < rock.radius + 25) return;
            }

            let newNest = { x, y, radius: 22 };
            nests.push(newNest);

            // Crear hormigas iniciales para este nuevo nido
            for (let i = 0; i < 5; i++) {
                ants.push(new Ant(newNest.x, newNest.y, newNest));
            }

            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 40;
                foods.push({
                    x: Math.max(20, Math.min(canvas.width - 20, x + offsetX)),
                    y: Math.max(20, Math.min(canvas.height - 20, y + offsetY)),
                    amount: 5
                });
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length;
            nestEl.textContent = nests.length;
            btnSpawn.disabled = nests.length === 0 || storedFood < 10;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (currentTool === 'nest') {
                placeNest(clickX, clickY);
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            } else if (currentTool === 'termites') {
                for(let i=0; i<3; i++) enemies.push(new Enemy(clickX + (Math.random()-0.5)*20, clickY + (Math.random()-0.5)*20, 'termites'));
            }
        });

        btnSpawn.addEventListener('click', () => {
            if (nests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                // Asignar al último hormiguero creado o al más cercano
                let randomNest = nests[Math.floor(Math.random() * nests.length)];
                ants.push(new Ant(randomNest.x, randomNest.y, randomNest));
                updateUI();
            }
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            ctx.fillStyle = '#43702f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + 2, g.y - g.h);
                ctx.stroke();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r of rocks) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(r.x + 4, r.y + 5, r.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#737a77';
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.arc(b.x + 4, b.y + 4, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#264e21';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let t of trees) {
                ctx.fillStyle = 'rgba(10, 20, 8, 0.25)';
                ctx.beginPath();
                ctx.arc(t.x + 18, t.y + 20, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#3d2814';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(28, 66, 23, 0.78)';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            for (let s = 0; s < gameSpeed; s++) {
                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }
                for (let ant of ants) ant.update();
                for (let en of enemies) en.update();
            }

            drawEnvironmentBase();

            for (let p of pheromones) {
                ctx.fillStyle = `rgba(220, 245, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let f of foods) {
                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 2.2 + f.amount * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dibujar todos los hormigueros
            for (let n of nests) {
                ctx.fillStyle = '#65422d';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#170e09';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius - 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Previsualizador si seleccionas hormiguero
            if (currentTool === 'nest') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mousePos.x, mousePos.y, 22, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            for (let ant of ants) ant.draw();
            for (let en of enemies) en.draw();

            drawCanopyLayer();

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>

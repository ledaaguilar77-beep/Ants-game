<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema: Guerra de Insectos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #151d13;
            color: #eef5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }
        header {
            text-align: center;
            margin-bottom: 8px;
        }
        h1 { font-size: 1.5rem; color: #a7c957; }
        #status-msg {
            font-size: 0.9rem;
            color: #f2e8cf;
            background: #386641;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
            font-weight: bold;
        }
        
        .hud {
            display: flex;
            gap: 12px;
            background: #23301f;
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid #4f6d45;
            margin-bottom: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat { font-weight: bold; font-size: 0.95rem; }
        .stat span { color: #a7c957; }
        
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #4a7c36;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #6a994e; }
        button:active { transform: scale(0.95); }
        button.active {
            background-color: #bc4749;
            box-shadow: 0 0 8px rgba(255,255,255,0.4);
        }
        button:disabled {
            background-color: #3b4637;
            color: #788773;
            cursor: not-allowed;
        }
        .btn-action { background-color: #386641; }
        .btn-action:hover { background-color: #4a7c36; }
        .btn-danger { background-color: #9b2226; }
        .btn-danger:hover { background-color: #bc4749; }

        canvas {
            background-color: #43702f;
            border: 4px solid #273b20;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Cadena Alimenticia: Hormigas vs Depredadores</h1>
        <div id="status-msg">🛠️ Herramienta: Colocar Hormiguero</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">40</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat">👾 Enemigos: <span id="enemy-count">0</span></div>
        <button id="btn-spawn-ant" disabled>Crear Hormiga (10 🍓)</button>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Reiniciar Mapa</button>
    </div>

    <div class="toolbar">
        <button id="tool-nest" class="active" onclick="setTool('nest')">🏠 Colocar Hormiguero</button>
        <button id="tool-food" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="btn-action" onclick="setTool('spider')">🕷️ Invocar Araña</button>
        <button id="tool-mantis" class="btn-action" onclick="setTool('mantis')">🦗 Invocar Mantis (Jefe)</button>
        <button id="tool-termites" class="btn-action" onclick="setTool('termites')">🐜 Invocar Termitas</button>
    </div>

    <canvas id="gameCanvas" width="1200" height="750"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI
        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const enemyEl = document.getElementById('enemy-count');
        const statusEl = document.getElementById('status-msg');
        const btnSpawn = document.getElementById('btn-spawn-ant');
        const btnSpeed = document.getElementById('btn-speed');

        // Estado
        let currentTool = 'nest';
        let storedFood = 40;
        let nests = [];
        let ants = [];
        let enemies = [];
        let foods = [];
        let pheromones = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        // Entorno
        let grassBlades = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');

            const names = {
                nest: "🏠 Colocar Hormiguero (Haz clic en el césped)",
                food: "🍓 Soltar Comida (Alimenta a hormigas y enemigos)",
                spider: "🕷️ Invocar Araña (Cazador mediano - 60 HP)",
                mantis: "🦗 Invocar Mantis (Depredador gigante - 130 HP)",
                termites: "🐜 Invocar Termitas (Enjambre rival - 20 HP c/u)"
            };
            statusEl.textContent = names[tool];
        }

        class Ant {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2.0;
                this.hp = 22;
                this.maxHp = 22;
                this.damage = 0.6;
                this.hasFood = false;
                this.pheromoneTimer = 0;
            }

            update() {
                // 1. Buscar enemigo cercano para atacar en grupo (si no lleva comida)
                let targetEnemy = null;
                let minEnemyDist = 95;

                if (!this.hasFood) {
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, en.y - this.y);
                        if (d < minEnemyDist) {
                            minEnemyDist = d;
                            targetEnemy = en;
                        }
                    }
                }

                if (targetEnemy) {
                    // Cargar hacia el enemigo y morderlo
                    const targetAngle = Math.atan2(targetEnemy.y - this.y, targetEnemy.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);

                    if (minEnemyDist < targetEnemy.radius + 6) {
                        targetEnemy.hp -= this.damage;
                        // Retroceso leve al morder
                        this.x -= Math.cos(this.angle) * 1.5;
                        this.y -= Math.sin(this.angle) * 1.5;
                    }
                } else {
                    // Comportamiento normal de recolección
                    this.angle += (Math.random() - 0.5) * 0.45;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        this.pheromoneTimer++;
                        if (this.pheromoneTimer % 6 === 0) {
                            pheromones.push({ x: this.x, y: this.y, life: 350 });
                        }

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 2;
                            this.hp = Math.min(this.maxHp, this.hp + 5); // Se cura al volver al nido
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        let foundTarget = false;
                        for (let i = foods.length - 1; i >= 0; i--) {
                            const f = foods[i];
                            const dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 75) {
                                const targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);
                                foundTarget = true;

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }

                        if (!foundTarget && pheromones.length > 0) {
                            let bestPheromone = null;
                            let maxLife = 0;

                            for (let p of pheromones) {
                                const dist = Math.hypot(p.x - this.x, p.y - this.y);
                                if (dist > 10 && dist < 60) {
                                    const angleToP = Math.atan2(p.y - this.y, p.x - this.x);
                                    const diff = Math.abs(this.normalizeAngle(angleToP - this.angle));
                                    if (diff < 1.1 && p.life > maxLife) {
                                        maxLife = p.life;
                                        bestPheromone = p;
                                    }
                                }
                            }

                            if (bestPheromone) {
                                const targetAngle = Math.atan2(bestPheromone.y - this.y, bestPheromone.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);
                            }
                        }
                    }
                }

                // Movimiento y colisión con rocas
                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + 4) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                // Límites
                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#2b120a';
                ctx.beginPath();
                ctx.ellipse(-4, 0, 3.2, 2.1, 0, 0, Math.PI * 2);
                ctx.ellipse(0, 0, 2.2, 1.5, 0, 0, Math.PI * 2);
                ctx.ellipse(3.5, 0, 2, 1.8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(6.5, 0, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'spider', 'mantis', 'termites'
                this.angle = Math.random() * Math.PI * 2;
                
                if (type === 'mantis') {
                    this.speed = 2.1;
                    this.radius = 20; // Mucho más grande
                    this.hp = 140;
                    this.maxHp = 140;
                    this.damage = 3.2; // Muy poderosa
                    this.sight = 240;
                } else if (type === 'spider') {
                    this.speed = 1.5;
                    this.radius = 13;
                    this.hp = 65;
                    this.maxHp = 65;
                    this.damage = 1.6;
                    this.sight = 180;
                } else { // termitas
                    this.speed = 1.75;
                    this.radius = 7;
                    this.hp = 20;
                    this.maxHp = 20;
                    this.damage = 0.65;
                    this.sight = 140;
                }
            }

            update() {
                let target = null;
                let targetType = null; // 'ant', 'enemy', 'food'
                let minDist = this.sight;

                // 1. Buscar otros enemigos de distinta especie para pelear
                for (let other of enemies) {
                    if (other !== this && other.type !== this.type) {
                        let d = Math.hypot(other.x - this.x, other.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            target = other;
                            targetType = 'enemy';
                        }
                    }
                }

                // 2. Buscar hormigas
                for (let ant of ants) {
                    let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                    if (d < minDist) {
                        minDist = d;
                        target = ant;
                        targetType = 'ant';
                    }
                }

                // 3. Si no hay presas cerca (o tiene poca vida), buscar comida en el suelo
                if (!target || this.hp < this.maxHp * 0.6) {
                    for (let i = foods.length - 1; i >= 0; i--) {
                        let f = foods[i];
                        let d = Math.hypot(f.x - this.x, f.y - this.y);
                        if (d < minDist) {
                            minDist = d;
                            target = f;
                            targetType = 'food';
                        }
                    }
                }

                if (target) {
                    let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.16);

                    if (targetType === 'ant' && minDist < this.radius + 5) {
                        target.hp -= this.damage;
                        if (target.hp <= 0) {
                            this.hp = Math.min(this.maxHp, this.hp + 8); // Se alimenta al matar
                        }
                    } else if (targetType === 'enemy' && minDist < this.radius + target.radius + 4) {
                        target.hp -= this.damage;
                        if (target.hp <= 0) {
                            this.hp = Math.min(this.maxHp, this.hp + 25);
                        }
                    } else if (targetType === 'food' && minDist < this.radius + 6) {
                        target.amount--;
                        this.hp = Math.min(this.maxHp, this.hp + 12);
                        if (target.amount <= 0) {
                            let idx = foods.indexOf(target);
                            if (idx > -1) foods.splice(idx, 1);
                        }
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.35;
                }

                // Movimiento y evitación de rocas
                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + this.radius * 0.7) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 25) { this.x = 25; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 25) { this.x = canvas.width - 25; this.angle = Math.PI - this.angle; }
                if (this.y < 25) { this.y = 25; this.angle = -this.angle; }
                if (this.y > canvas.height - 25) { this.y = canvas.height - 25; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barra de vida arriba del enemigo
                const barWidth = this.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-barWidth / 2, -this.radius - 10, barWidth, 4);
                ctx.fillStyle = this.type === 'mantis' ? '#ffbe0b' : '#e63946';
                ctx.fillRect(-barWidth / 2, -this.radius - 10, barWidth * Math.max(0, this.hp / this.maxHp), 4);

                ctx.rotate(this.angle);

                if (this.type === 'mantis') {
                    // Sombra grande
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(-2, 4, 22, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Patas delanteras de ataque (guadañas)
                    ctx.strokeStyle = '#52b788';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(8, -4); ctx.lineTo(22, -12); ctx.lineTo(16, -3);
                    ctx.moveTo(8, 4); ctx.lineTo(22, 12); ctx.lineTo(16, 3);
                    ctx.stroke();

                    // Cuerpo alargado verde brillante
                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.ellipse(-6, 0, 14, 6, 0, 0, Math.PI * 2); // Abdomen
                    ctx.fill();

                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(8, 0, 9, 4.5, 0, 0, Math.PI * 2); // Tórax
                    ctx.fill();

                    // Cabeza triangular y ojos
                    ctx.fillStyle = '#74c69d';
                    ctx.beginPath();
                    ctx.arc(17, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(19, -3.5, 2, 0, Math.PI * 2);
                    ctx.arc(19, 3.5, 2, 0, Math.PI * 2);
                    ctx.fill();

                } else if (this.type === 'spider') {
                    // Patas de araña
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    for (let i = -1; i <= 1; i += 2) {
                        ctx.beginPath();
                        ctx.moveTo(0, 0); ctx.lineTo(-12, i * 16);
                        ctx.moveTo(0, 0); ctx.lineTo(-4, i * 18);
                        ctx.moveTo(0, 0); ctx.lineTo(5, i * 17);
                        ctx.moveTo(0, 0); ctx.lineTo(12, i * 14);
                        ctx.stroke();
                    }

                    // Abdomen y cabeza negra
                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(-5, 0, 9, 0, Math.PI * 2);
                    ctx.arc(5, 0, 6, 0, Math.PI * 2);
                    ctx.fill();

                    // Marca roja en el lomo y ojos
                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.arc(-5, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(8, -3, 2, 2);
                    ctx.fillRect(8, 1, 2, 2);

                } else { // Termita (cuerpo claro y cabeza naranja)
                    ctx.fillStyle = '#e6ccb2';
                    ctx.beginPath();
                    ctx.ellipse(-3, 0, 4.5, 3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#b08968';
                    ctx.beginPath();
                    ctx.arc(3.5, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];

            for (let i = 0; i < 800; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 4 + Math.random() * 6,
                    color: Math.random() > 0.5 ? '#3b6829' : '#4e8038'
                });
            }

            for (let i = 0; i < 12; i++) {
                rocks.push({
                    x: 80 + Math.random() * (canvas.width - 160),
                    y: 80 + Math.random() * (canvas.height - 160),
                    radius: 18 + Math.random() * 20
                });
            }

            const flowerColors = ['#ffbe0b', '#ff006e', '#ffffff', '#fb5607'];
            for (let i = 0; i < 60; i++) {
                flowers.push({
                    x: 30 + Math.random() * (canvas.width - 60),
                    y: 30 + Math.random() * (canvas.height - 60),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 10; i++) {
                const bx = 60 + Math.random() * (canvas.width - 120);
                const by = 60 + Math.random() * (canvas.height - 120);
                bushes.push({ x: bx, y: by, radius: 26 + Math.random() * 12 });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 45, by + (Math.random() - 0.5) * 45, 10);
            }

            for (let i = 0; i < 8; i++) {
                trees.push({
                    x: 90 + Math.random() * (canvas.width - 180),
                    y: 90 + Math.random() * (canvas.height - 180),
                    radius: 52 + Math.random() * 20
                });
            }
        }

        function init() {
            nests = [];
            ants = [];
            enemies = [];
            pheromones = [];
            storedFood = 40;
            generateEnvironment();
            updateUI();
            setTool('nest');
        }

        function placeNest(x, y) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, y - rock.y) < rock.radius + 25) return;
            }

            let newNest = { x, y, radius: 22 };
            nests.push(newNest);

            for (let i = 0; i < 8; i++) {
                ants.push(new Ant(newNest.x, newNest.y, newNest));
            }
            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 40;
                const offsetY = (Math.random() - 0.5) * 40;
                foods.push({
                    x: Math.max(20, Math.min(canvas.width - 20, x + offsetX)),
                    y: Math.max(20, Math.min(canvas.height - 20, y + offsetY)),
                    amount: 5
                });
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length;
            enemyEl.textContent = enemies.length;
            btnSpawn.disabled = nests.length === 0 || storedFood < 10;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (currentTool === 'nest') {
                placeNest(clickX, clickY);
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            } else if (currentTool === 'termites') {
                for (let i = 0; i < 4; i++) {
                    enemies.push(new Enemy(clickX + (Math.random() - 0.5) * 25, clickY + (Math.random() - 0.5) * 25, 'termites'));
                }
            }
            updateUI();
        });

        btnSpawn.addEventListener('click', () => {
            if (nests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                let randomNest = nests[Math.floor(Math.random() * nests.length)];
                ants.push(new Ant(randomNest.x, randomNest.y, randomNest));
                updateUI();
            }
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            ctx.fillStyle = '#43702f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + 2, g.y - g.h);
                ctx.stroke();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r of rocks) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(r.x + 4, r.y + 5, r.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#737a77';
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.beginPath();
                ctx.arc(b.x + 4, b.y + 4, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#264e21';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let t of trees) {
                ctx.fillStyle = 'rgba(10, 20, 8, 0.25)';
                ctx.beginPath();
                ctx.arc(t.x + 18, t.y + 20, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#3d2814';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(28, 66, 23, 0.78)';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            let needsUIUpdate = false;

            for (let s = 0; s < gameSpeed; s++) {
                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }

                for (let ant of ants) ant.update();
                for (let en of enemies) en.update();

                // Eliminar hormigas derrotadas y soltar comida
                for (let i = ants.length - 1; i >= 0; i--) {
                    if (ants[i].hp <= 0) {
                        foods.push({ x: ants[i].x, y: ants[i].y, amount: 2 });
                        ants.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                // Eliminar enemigos derrotados y soltar botín de comida grande
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        let dropAmount = enemies[i].type === 'mantis' ? 25 : enemies[i].type === 'spider' ? 12 : 4;
                        spawnFoodCluster(enemies[i].x, enemies[i].y, Math.ceil(dropAmount / 3));
                        enemies.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }
            }

            if (needsUIUpdate) updateUI();

            drawEnvironmentBase();

            for (let p of pheromones) {
                ctx.fillStyle = `rgba(220, 245, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let f of foods) {
                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 2.2 + f.amount * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let n of nests) {
                ctx.fillStyle = '#65422d';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 7, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#170e09';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius - 5, 0, Math.PI * 2);
                ctx.fill();
            }

            if (currentTool === 'nest') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mousePos.x, mousePos.y, 22, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            for (let ant of ants) ant.draw();
            for (let en of enemies) en.draw();

            drawCanopyLayer();

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>

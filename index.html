<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema Gigante: Hormigas vs Termitas</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #121810;
            color: #eef5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        header {
            text-align: center;
            margin-bottom: 6px;
        }
        h1 { font-size: 1.4rem; color: #a7c957; }
        #status-msg {
            font-size: 0.85rem;
            color: #f2e8cf;
            background: #386641;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 3px;
            font-weight: bold;
        }
        
        .hud {
            display: flex;
            gap: 12px;
            background: #202b1d;
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid #4f6d45;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat { font-weight: bold; font-size: 0.9rem; }
        .stat span { color: #a7c957; }
        
        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #4a7c36;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #6a994e; }
        button:active { transform: scale(0.95); }
        button.active {
            background-color: #bc4749;
            box-shadow: 0 0 6px rgba(255,255,255,0.4);
        }
        button:disabled {
            background-color: #333b30;
            color: #6c7867;
            cursor: not-allowed;
        }
        .btn-ant { background-color: #386641; }
        .btn-termite { background-color: #bc6c25; }
        .btn-termite:hover { background-color: #dda15e; }
        .btn-predator { background-color: #6a040f; }
        .btn-predator:hover { background-color: #9d0208; }
        .btn-danger { background-color: #780000; }

        canvas {
            background-color: #3f6b2b;
            border: 4px solid #23381a;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Ecosistema Expandido: Hormigas vs Termitas y Depredadores</h1>
        <div id="status-msg">🛠️ Herramienta: Colocar Hormiguero (Hormigas)</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">60</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat">🏗️ Termitas: <span id="termite-count">0</span></div>
        <div class="stat">🏰 Nidos: <span id="nest-count">0</span></div>
        <button id="btn-spawn-ant" disabled>Crear Hormiga (10 🍓)</button>
        <button id="btn-spawn-termite" disabled>Crear Termita (10 🍓)</button>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Reiniciar Mapa</button>
    </div>

    <div class="toolbar">
        <button id="tool-nest" class="active" onclick="setTool('nest')">🏠 Nido Hormigas</button>
        <button id="tool-termite-nest" class="btn-termite" onclick="setTool('termite_nest')">🏰 Nido Termitas</button>
        <button id="tool-food" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="btn-predator" onclick="setTool('spider')">🕷️ Araña</button>
        <button id="tool-mantis" class="btn-predator" onclick="setTool('mantis')">🦗 Mantis (Jefe)</button>
    </div>

    <canvas id="gameCanvas" width="1500" height="900"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI
        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const termiteEl = document.getElementById('termite-count');
        const nestEl = document.getElementById('nest-count');
        const statusEl = document.getElementById('status-msg');
        const btnSpawnAnt = document.getElementById('btn-spawn-ant');
        const btnSpawnTermite = document.getElementById('btn-spawn-termite');
        const btnSpeed = document.getElementById('btn-speed');

        // Estado
        let currentTool = 'nest';
        let storedFood = 60;
        let antNests = [];
        let termiteNests = [];
        let ants = [];
        let termites = [];
        let enemies = [];
        let foods = [];
        let pheromones = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        // Entorno detallado
        let grassBlades = [];
        let dirtPatches = [];
        let logs = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');

            const names = {
                nest: "🏠 Colocar Nido de Hormigas (Haz clic en el césped)",
                termite_nest: "🏰 Colocar Nido de Termitas (Estructura de arcilla y chimeneas)",
                food: "🍓 Soltar Comida (Alimenta a las colonias)",
                spider: "🕷️ Invocar Araña (Depredador letal)",
                mantis: "🦗 Invocar Mantis Religiosa (Depredador alfa gigante)"
            };
            statusEl.textContent = names[tool];
        }

        class Ant {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2.0;
                this.hp = 22;
                this.maxHp = 22;
                this.damage = 0.65;
                this.hasFood = false;
                this.pheromoneTimer = 0;
            }

            update() {
                // Atacar termitas o depredadores cercanos
                let target = null;
                let minDist = 90;

                if (!this.hasFood) {
                    for (let t of termites) {
                        let d = Math.hypot(t.x - this.x, t.y - this.y);
                        if (d < minDist) { minDist = d; target = t; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, en.y - this.y);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);

                    if (minDist < target.radius + 6) {
                        target.hp -= this.damage;
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.45;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        this.pheromoneTimer++;
                        if (this.pheromoneTimer % 6 === 0) {
                            pheromones.push({ x: this.x, y: this.y, life: 350 });
                        }

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 2;
                            this.hp = Math.min(this.maxHp, this.hp + 5);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        let foundTarget = false;
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 80) {
                                let targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);
                                foundTarget = true;

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }

                        if (!foundTarget && pheromones.length > 0) {
                            let bestPheromone = null;
                            let maxLife = 0;

                            for (let p of pheromones) {
                                let dist = Math.hypot(p.x - this.x, p.y - this.y);
                                if (dist > 10 && dist < 65) {
                                    let angleToP = Math.atan2(p.y - this.y, p.x - this.x);
                                    let diff = Math.abs(this.normalizeAngle(angleToP - this.angle));
                                    if (diff < 1.1 && p.life > maxLife) {
                                        maxLife = p.life;
                                        bestPheromone = p;
                                    }
                                }
                            }

                            if (bestPheromone) {
                                let targetAngle = Math.atan2(bestPheromone.y - this.y, bestPheromone.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);
                            }
                        }
                    }
                }

                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + 4) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                ctx.fillStyle = '#2b120a';
                ctx.beginPath();
                ctx.ellipse(-4, 0, 3.2, 2.1, 0, 0, Math.PI * 2);
                ctx.ellipse(0, 0, 2.2, 1.5, 0, 0, Math.PI * 2);
                ctx.ellipse(3.5, 0, 2, 1.8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(6.5, 0, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Termite {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.8;
                this.hp = 25;
                this.maxHp = 25;
                this.damage = 0.7;
                this.hasFood = false;
            }

            update() {
                // Atacar hormigas o depredadores cercanos
                let target = null;
                let minDist = 85;

                if (!this.hasFood) {
                    for (let ant of ants) {
                        let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                        if (d < minDist) { minDist = d; target = ant; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, en.y - this.y);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);

                    if (minDist < target.radius + 6) {
                        target.hp -= this.damage;
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.4;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 1;
                            this.hp = Math.min(this.maxHp, this.hp + 5);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        // Buscar comida
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 75) {
                                let targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.22);

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }
                    }
                }

                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + 4) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Cuerpo claro de termita y cabeza grande mandibulada
                ctx.fillStyle = '#e3d5ca';
                ctx.beginPath();
                ctx.ellipse(-3, 0, 4, 2.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#bc6c25';
                ctx.beginPath();
                ctx.arc(3, 0, 2.8, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(6, 0, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'spider', 'mantis'
                this.angle = Math.random() * Math.PI * 2;
                
                if (type === 'mantis') {
                    this.speed = 2.1;
                    this.radius = 20;
                    this.hp = 150;
                    this.maxHp = 150;
                    this.damage = 3.5;
                    this.sight = 250;
                } else { // spider
                    this.speed = 1.6;
                    this.radius = 14;
                    this.hp = 70;
                    this.maxHp = 70;
                    this.damage = 1.8;
                    this.sight = 190;
                }
            }

            update() {
                let target = null;
                let minDist = this.sight;

                // Buscar hormigas o termitas
                for (let ant of ants) {
                    let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                    if (d < minDist) { minDist = d; target = ant; }
                }
                for (let t of termites) {
                    let d = Math.hypot(t.x - this.x, t.y - this.y);
                    if (d < minDist) { minDist = d; target = t; }
                }

                if (target) {
                    let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.16);

                    if (minDist < this.radius + target.radius + 4) {
                        target.hp -= this.damage;
                        if (target.hp <= 0) {
                            this.hp = Math.min(this.maxHp, this.hp + 15);
                        }
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.35;
                }

                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                for (let rock of rocks) {
                    if (Math.hypot(nextX - rock.x, nextY - rock.y) < rock.radius + this.radius * 0.7) {
                        this.angle += Math.PI / 2;
                        nextX = this.x + Math.cos(this.angle) * this.speed;
                        nextY = this.y + Math.sin(this.angle) * this.speed;
                        break;
                    }
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 25) { this.x = 25; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 25) { this.x = canvas.width - 25; this.angle = Math.PI - this.angle; }
                if (this.y < 25) { this.y = 25; this.angle = -this.angle; }
                if (this.y > canvas.height - 25) { this.y = canvas.height - 25; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                const barWidth = this.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-barWidth / 2, -this.radius - 10, barWidth, 4);
                ctx.fillStyle = this.type === 'mantis' ? '#ffbe0b' : '#e63946';
                ctx.fillRect(-barWidth / 2, -this.radius - 10, barWidth * Math.max(0, this.hp / this.maxHp), 4);

                ctx.rotate(this.angle);

                if (this.type === 'mantis') {
                    ctx.fillStyle = 'rgba(0,0,0,0.3)';
                    ctx.beginPath();
                    ctx.ellipse(-2, 4, 22, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#52b788';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(8, -4); ctx.lineTo(22, -12); ctx.lineTo(16, -3);
                    ctx.moveTo(8, 4); ctx.lineTo(22, 12); ctx.lineTo(16, 3);
                    ctx.stroke();

                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.ellipse(-6, 0, 14, 6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(8, 0, 9, 4.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#74c69d';
                    ctx.beginPath();
                    ctx.arc(17, 0, 5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(19, -3.5, 2, 0, Math.PI * 2);
                    ctx.arc(19, 3.5, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    for (let i = -1; i <= 1; i += 2) {
                        ctx.beginPath();
                        ctx.moveTo(0, 0); ctx.lineTo(-12, i * 16);
                        ctx.moveTo(0, 0); ctx.lineTo(-4, i * 18);
                        ctx.moveTo(0, 0); ctx.lineTo(5, i * 17);
                        ctx.moveTo(0, 0); ctx.lineTo(12, i * 14);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#1a1a1a';
                    ctx.beginPath();
                    ctx.arc(-5, 0, 9, 0, Math.PI * 2);
                    ctx.arc(5, 0, 6, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.arc(-5, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }

            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            dirtPatches = [];
            logs = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];

            // Parches de tierra variados
            for (let i = 0; i < 15; i++) {
                dirtPatches.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: 40 + Math.random() * 50
                });
            }

            for (let i = 0; i < 1200; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 4 + Math.random() * 6,
                    color: Math.random() > 0.5 ? '#365e24' : '#477d30'
                });
            }

            // Troncos caídos decorativos y de obstáculo
            for (let i = 0; i < 6; i++) {
                logs.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 100 + Math.random() * (canvas.height - 200),
                    w: 70 + Math.random() * 50,
                    h: 22 + Math.random() * 10,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 16; i++) {
                rocks.push({
                    x: 80 + Math.random() * (canvas.width - 160),
                    y: 80 + Math.random() * (canvas.height - 160),
                    radius: 18 + Math.random() * 22
                });
            }

            const flowerColors = ['#ffbe0b', '#ff006e', '#ffffff', '#fb5607', '#9d4edd'];
            for (let i = 0; i < 80; i++) {
                flowers.push({
                    x: 30 + Math.random() * (canvas.width - 60),
                    y: 30 + Math.random() * (canvas.height - 60),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 14; i++) {
                const bx = 60 + Math.random() * (canvas.width - 120);
                const by = 60 + Math.random() * (canvas.height - 120);
                bushes.push({ x: bx, y: by, radius: 28 + Math.random() * 14 });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 50, by + (Math.random() - 0.5) * 50, 10);
            }

            for (let i = 0; i < 11; i++) {
                trees.push({
                    x: 100 + Math.random() * (canvas.width - 200),
                    y: 100 + Math.random() * (canvas.height - 200),
                    radius: 55 + Math.random() * 22
                });
            }
        }

        function init() {
            antNests = [];
            termiteNests = [];
            ants = [];
            termites = [];
            enemies = [];
            pheromones = [];
            storedFood = 60;
            generateEnvironment();
            updateUI();
            setTool('nest');
        }

        function placeNest(x, y, type) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, y - rock.y) < rock.radius + 25) return;
            }

            let newNest = { x, y, radius: 24 };
            if (type === 'ant') {
                antNests.push(newNest);
                for (let i = 0; i < 8; i++) ants.push(new Ant(x, y, newNest));
            } else {
                termiteNests.push(newNest);
                for (let i = 0; i < 6; i++) termites.push(new Termite(x, y, newNest));
            }
            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 45;
                const offsetY = (Math.random() - 0.5) * 45;
                foods.push({
                    x: Math.max(20, Math.min(canvas.width - 20, x + offsetX)),
                    y: Math.max(20, Math.min(canvas.height - 20, y + offsetY)),
                    amount: 5
                });
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length;
            termiteEl.textContent = termites.length;
            nestEl.textContent = antNests.length + termiteNests.length;
            btnSpawnAnt.disabled = antNests.length === 0 || storedFood < 10;
            btnSpawnTermite.disabled = termiteNests.length === 0 || storedFood < 10;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (currentTool === 'nest') {
                placeNest(clickX, clickY, 'ant');
            } else if (currentTool === 'termite_nest') {
                placeNest(clickX, clickY, 'termite');
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            }
            updateUI();
        });

        btnSpawnAnt.addEventListener('click', () => {
            if (antNests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                let n = antNests[Math.floor(Math.random() * antNests.length)];
                ants.push(new Ant(n.x, n.y, n));
                updateUI();
            }
        });

        btnSpawnTermite.addEventListener('click', () => {
            if (termiteNests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                let n = termiteNests[Math.floor(Math.random() * termiteNests.length)];
                termites.push(new Termite(n.x, n.y, n));
                updateUI();
            }
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            ctx.fillStyle = '#3f6b2b';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Parches de tierra orgánica
            for (let d of dirtPatches) {
                ctx.fillStyle = 'rgba(74, 53, 33, 0.35)';
                ctx.beginPath();
                ctx.arc(d.x, d.y, d.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + 2, g.y - g.h);
                ctx.stroke();
            }

            // Troncos caídos
            for (let l of logs) {
                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.rotate(l.angle);
                ctx.fillStyle = '#4a2e18';
                ctx.beginPath();
                ctx.roundRect(-l.w/2, -l.h/2, l.w, l.h, 6);
                ctx.fill();
                ctx.strokeStyle = '#2b190d';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r of rocks) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                ctx.beginPath();
                ctx.arc(r.x + 4, r.y + 5, r.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#6b7270';
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.fillStyle = 'rgba(0,0,0,0.22)';
                ctx.beginPath();
                ctx.arc(b.x + 4, b.y + 4, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#22481d';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let t of trees) {
                ctx.fillStyle = 'rgba(10, 20, 8, 0.28)';
                ctx.beginPath();
                ctx.arc(t.x + 18, t.y + 20, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#332010';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 9, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(24, 58, 20, 0.8)';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            let needsUIUpdate = false;

            for (let s = 0; s < gameSpeed; s++) {
                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }

                for (let ant of ants) ant.update();
                for (let t of termites) t.update();
                for (let en of enemies) en.update();

                // Hormigas derrotadas
                for (let i = ants.length - 1; i >= 0; i--) {
                    if (ants[i].hp <= 0) {
                        foods.push({ x: ants[i].x, y: ants[i].y, amount: 2 });
                        ants.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                // Termitas derrotadas
                for (let i = termites.length - 1; i >= 0; i--) {
                    if (termites[i].hp <= 0) {
                        foods.push({ x: termites[i].x, y: termites[i].y, amount: 3 });
                        termites.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                // Depredadores derrotados
                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        let drop = enemies[i].type === 'mantis' ? 25 : 12;
                        spawnFoodCluster(enemies[i].x, enemies[i].y, Math.ceil(drop / 3));
                        enemies.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }
            }

            if (needsUIUpdate) updateUI();

            drawEnvironmentBase();

            for (let p of pheromones) {
                ctx.fillStyle = `rgba(220, 245, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let f of foods) {
                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 2.2 + f.amount * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dibujar Nidos de Hormigas
            for (let n of antNests) {
                ctx.fillStyle = '#65422d';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#170e09';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius - 5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dibujar Nidos de Termitas (Montículos de arcilla con chimeneas)
            for (let n of termiteNests) {
                ctx.fillStyle = '#8d5524';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#b07d62';
                ctx.beginPath();
                ctx.arc(n.x - 4, n.y - 4, n.radius * 0.65, 0, Math.PI * 2);
                ctx.fill();

                // Chimeneas características del nido de termitas
                ctx.fillStyle = '#5c3a21';
                ctx.beginPath();
                ctx.arc(n.x + 3, n.y + 3, 5, 0, Math.PI * 2);
                ctx.arc(n.x - 6, n.y + 4, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            // Previsualizador de colocación
            if (currentTool === 'nest' || currentTool === 'termite_nest') {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(mousePos.x, mousePos.y, 24, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            for (let ant of ants) ant.draw();
            for (let t of termites) t.draw();
            for (let en of enemies) en.draw();

            drawCanopyLayer();

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>

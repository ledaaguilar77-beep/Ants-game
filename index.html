<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ants Empires and Colony</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b1109;
            color: #f4f1de;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
            overflow-x: hidden;
        }

        /* Pantalla de Inicio */
        #start-screen {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(27, 46, 17, 0.94), rgba(6, 11, 5, 0.99));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            text-align: center;
            padding: 20px;
        }
        #start-screen h1 {
            font-size: 3.2rem;
            color: #b5e48c;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.95), 0 0 25px rgba(181, 228, 140, 0.35);
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }
        #start-screen p {
            color: #d8f3dc;
            font-size: 1.05rem;
            max-width: 540px;
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .menu-buttons {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .menu-btn {
            padding: 15px 34px;
            font-size: 1.15rem;
            border-radius: 12px;
            border: 2px solid #95d5b2;
            cursor: pointer;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 8px 25px rgba(0,0,0,0.65);
            transition: transform 0.15s, filter 0.2s, box-shadow 0.2s;
        }
        .menu-btn:hover {
            transform: translateY(-3px);
            filter: brightness(1.15);
            box-shadow: 0 12px 30px rgba(82, 183, 136, 0.4);
        }
        .menu-btn:active { transform: scale(0.96); }
        .btn-mode-normal {
            background: linear-gradient(180deg, #e09f3e, #9e2a2b);
            border-color: #fff3b0;
        }
        .btn-mode-sandbox {
            background: linear-gradient(180deg, #52b788, #1b4332);
            border-color: #b7e4c7;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
        }
        header h1 { 
            font-size: 1.35rem; 
            color: #b5e48c; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        #status-msg {
            font-size: 0.82rem;
            color: #fefae0;
            background: linear-gradient(90deg, #2d6a4f, #40916c);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 3px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        
        .hud {
            display: flex;
            gap: 14px;
            background: rgba(20, 30, 18, 0.92);
            padding: 7px 16px;
            border-radius: 10px;
            border: 1px solid #52796f;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .stat { font-weight: bold; font-size: 0.85rem; }
        .stat span { color: #b5e48c; }
        .stat-enemy span { color: #ff758f; }
        .stat-egg span { color: #ffd166; }
        
        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button.tool-btn, .hud button {
            background: linear-gradient(180deg, #52b788, #2d6a4f);
            color: white;
            border: 1px solid #74c69d;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.76rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        button.tool-btn:hover, .hud button:hover { filter: brightness(1.15); }
        button.tool-btn:active, .hud button:active { transform: scale(0.95); }
        button.tool-btn.active {
            background: linear-gradient(180deg, #e63946, #9b2226);
            border-color: #ffb3c1;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.7);
        }
        button.tool-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }
        .btn-queen { background: linear-gradient(180deg, #f4a261, #b5651d) !important; border-color: #ffe5d9 !important; }
        .btn-termite { background: linear-gradient(180deg, #dda15e, #bc6c25) !important; border-color: #faedcd !important; }
        .btn-beetle { background: linear-gradient(180deg, #606c38, #283618) !important; border-color: #a3b18a !important; }
        .btn-predator { background: linear-gradient(180deg, #9d0208, #6a040f) !important; border-color: #ffccd5 !important; }
        .btn-danger { background: linear-gradient(180deg, #800f2f, #590d22) !important; border-color: #ff758f !important; }
        .btn-menu-back { background: linear-gradient(180deg, #495057, #212529) !important; border-color: #adb5bd !important; }

        canvas {
            background-color: #345822;
            border: 3px solid #1b2e11;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 14px 40px rgba(0,0,0,0.95);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <!-- Pantalla de Título -->
    <div id="start-screen">
        <h1>🐜 Ants Empires and Colony</h1>
        <p>Construye y dirige tu imperio subterráneo en el bosque salvaje. Elige un modo de juego para comenzar:</p>
        <div class="menu-buttons">
            <button class="menu-btn btn-mode-normal" onclick="startGame('normal')">👑 Modo Normal</button>
            <button class="menu-btn btn-mode-sandbox" onclick="startGame('sandbox')">🌿 Modo Sandbox</button>
        </div>
    </div>

    <header>
        <h1>🐜 Ants Empires and Colony <span id="mode-badge" style="font-size: 0.85rem; color: #ffd166;"></span></h1>
        <div id="status-msg">Selecciona un modo de juego</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">100</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat sandbox-only">🏗️ Termitas: <span id="termite-count">0</span></div>
        <div class="stat stat-enemy sandbox-only">☠️ Enemigos: <span id="enemy-count">0</span></div>
        <div class="stat stat-egg normal-only" style="display:none;">🥚 Huevos: <span id="egg-count">0</span></div>
        <div class="stat">🏰 Nidos: <span id="nest-count">0</span></div>
        <div class="stat sandbox-only">🥚 Cría: <span id="spawn-progress">0/10 🍓</span></div>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Reiniciar</button>
        <button id="btn-back-menu" class="btn-menu-back" onclick="showMainMenu()">Menú</button>
    </div>

    <!-- Barra de herramientas Sandbox -->
    <div class="toolbar" id="toolbar-sandbox">
        <button id="tool-nest" class="tool-btn active" onclick="setTool('nest')">🏠 Nido Hormigas</button>
        <button id="tool-termite_nest" class="tool-btn btn-termite" onclick="setTool('termite_nest')">🏰 Nido Termitas</button>
        <button id="tool-beetle" class="tool-btn btn-beetle" onclick="setTool('beetle')">🪲 Escarabajo Pelotero</button>
        <button id="tool-food" class="tool-btn" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="tool-btn btn-predator" onclick="setTool('spider')">🕷️ Araña Teje-redes</button>
        <button id="tool-mantis" class="tool-btn btn-predator" onclick="setTool('mantis')">🦗 Mantis Alfa</button>
    </div>

    <!-- Barra de herramientas Modo Normal (Historia) -->
    <div class="toolbar" id="toolbar-normal" style="display:none;">
        <button id="tool-queen" class="tool-btn btn-queen active" onclick="setTool('queen')">👑 Colocar Reina</button>
        <button id="tool-normal_nest" class="tool-btn" onclick="setTool('normal_nest')" disabled>🏠 Colocar Colonia (0/1)</button>
    </div>

    <canvas id="gameCanvas" width="2200" height="1300"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const startScreen = document.getElementById('start-screen');
        const modeBadge = document.getElementById('mode-badge');
        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const termiteEl = document.getElementById('termite-count');
        const enemyEl = document.getElementById('enemy-count');
        const eggEl = document.getElementById('egg-count');
        const nestEl = document.getElementById('nest-count');
        const progressEl = document.getElementById('spawn-progress');
        const statusEl = document.getElementById('status-msg');
        const btnSpeed = document.getElementById('btn-speed');

        const TILT = 0.78;

        let gameMode = 'sandbox'; // 'normal' o 'sandbox'
        let currentTool = 'nest';
        let storedFood = 100;
        let foodSpawnCounter = 0;

        let queen = null;
        let queenTarget = null; // Punto destino al hacer clic en modo normal
        let eggs = []; // Huevos puestos por la reina (30s para eclosionar)

        let antNests = [];
        let termiteNests = [];
        let ants = [];
        let termites = [];
        let beetles = [];
        let enemies = [];
        let webs = [];
        let foods = [];
        let pheromones = [];
        let particles = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        // Controles de teclado para la Reina
        const keysPressed = {};
        window.addEventListener('keydown', (e) => {
            keysPressed[e.key.toLowerCase()] = true;
            if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) {
                if (gameMode === 'normal' && queen) e.preventDefault();
            }
        });
        window.addEventListener('keyup', (e) => {
            keysPressed[e.key.toLowerCase()] = false;
        });

        let grassBlades = [];
        let dirtPatches = [];
        let pebbles = [];
        let mushrooms = [];
        let ferns = [];
        let logs = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        const toolDescriptions = {
            nest: "🏠 Colocar Hormiguero (Crecimiento automático al recolectar comida)",
            termite_nest: "🏰 Colocar Termitero (Montículo arcilloso 3D)",
            beetle: "🪲 Invocar Escarabajo Pelotero (Tanque pacífico que recolecta bolas de comida)",
            food: "🍓 Soltar Comida (Bayas y néctar del bosque)",
            spider: "🕷️ Invocar Araña (Lanza telarañas que inmovilizan presas)",
            mantis: "🦗 Invocar Mantis Alfa (Depredador letal de gran tamaño)",
            queen: "👑 Haz clic en el suelo del bosque para colocar a tu Hormiga Reina",
            normal_nest: "🏠 Haz clic en un lugar despejado para fundar tu única Colonia",
            control_queen: "👑 Controla a la Reina (WASD / Flechas o Clic en el mapa): Recoge comida 🍓 y llévala a tu colonia para poner huevos (30s)"
        };

        function showMainMenu() {
            startScreen.style.display = 'flex';
        }

        function startGame(mode) {
            gameMode = mode;
            startScreen.style.display = 'none';

            if (mode === 'normal') {
                modeBadge.textContent = "[Modo Normal]";
                document.getElementById('toolbar-sandbox').style.display = 'none';
                document.getElementById('toolbar-normal').style.display = 'flex';
                document.querySelectorAll('.sandbox-only').forEach(el => el.style.display = 'none');
                document.querySelectorAll('.normal-only').forEach(el => el.style.display = 'block');
            } else {
                modeBadge.textContent = "[Modo Sandbox]";
                document.getElementById('toolbar-sandbox').style.display = 'flex';
                document.getElementById('toolbar-normal').style.display = 'none';
                document.querySelectorAll('.sandbox-only').forEach(el => el.style.display = 'block');
                document.querySelectorAll('.normal-only').forEach(el => el.style.display = 'none');
            }

            init();
        }

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
            if (document.getElementById(`tool-${tool}`)) {
                document.getElementById(`tool-${tool}`).classList.add('active');
            }
            if (toolDescriptions[tool]) {
                statusEl.textContent = toolDescriptions[tool];
                statusEl.style.background = "linear-gradient(90deg, #2d6a4f, #40916c)";
            }
        }

        function spawnHitParticles(x, y, color = '#fff', count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 1,
                    life: 15 + Math.random() * 10,
                    maxLife: 25,
                    color: color,
                    size: 1.5 + Math.random() * 2
                });
            }
        }

        function isCollidingWithLog(x, y, margin) {
            for (let l of logs) {
                const dx = x - l.x;
                const dy = (y - l.y) / TILT;
                const cos = Math.cos(-l.angle);
                const sin = Math.sin(-l.angle);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;
                if (Math.abs(localX) < l.w / 2 + margin && Math.abs(localY) < l.h / 2 + margin) return true;
            }
            return false;
        }

        function canPlaceAt(x, y, tool) {
            if (x < 45 || x > canvas.width - 45 || y < 45 || y > canvas.height - 45) return false;
            const reqRadius = (tool === 'nest' || tool === 'termite_nest' || tool === 'normal_nest') ? 28 : (tool === 'mantis') ? 22 : (tool === 'spider' || tool === 'beetle' || tool === 'queen') ? 16 : 12;

            for (let r of rocks) {
                if (Math.hypot(x - r.x, (y - r.y) / TILT) < r.radius + reqRadius) return false;
            }
            if (isCollidingWithLog(x, y, reqRadius)) return false;
            for (let n of antNests) {
                if (Math.hypot(x - n.x, (y - n.y) / TILT) < n.radius + reqRadius + 8) return false;
            }
            for (let n of termiteNests) {
                if (Math.hypot(x - n.x, (y - n.y) / TILT) < n.radius + reqRadius + 8) return false;
            }
            if (tool !== 'food') {
                for (let en of enemies) {
                    if (Math.hypot(x - en.x, (y - en.y) / TILT) < en.radius + reqRadius + 4) return false;
                }
            }
            return true;
        }

        function checkObstacleCollision(x, y, radius) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, (y - rock.y) / TILT) < rock.radius + radius) return true;
            }
            if (isCollidingWithLog(x, y, radius)) return true;
            return false;
        }

        function moveEntitySmooth(entity, speed, radius) {
            let nextX = entity.x + Math.cos(entity.angle) * speed;
            let nextY = entity.y + Math.sin(entity.angle) * speed * TILT;

            if (checkObstacleCollision(nextX, nextY, radius)) {
                const offsets = [0.4, -0.4, 0.85, -0.85, 1.4, -1.4, Math.PI];
                for (let off of offsets) {
                    let testAngle = entity.angle + off;
                    let tx = entity.x + Math.cos(testAngle) * speed;
                    let ty = entity.y + Math.sin(testAngle) * speed * TILT;
                    if (!checkObstacleCollision(tx, ty, radius)) {
                        entity.angle = testAngle;
                        nextX = tx;
                        nextY = ty;
                        break;
                    }
                }
            }

            entity.x = nextX;
            entity.y = nextY;

            const margin = 22;
            if (entity.x < margin) { entity.x = margin; entity.angle = Math.PI - entity.angle; }
            if (entity.x > canvas.width - margin) { entity.x = canvas.width - margin; entity.angle = Math.PI - entity.angle; }
            if (entity.y < margin) { entity.y = margin; entity.angle = -entity.angle; }
            if (entity.y > canvas.height - margin) { entity.y = canvas.height - margin; entity.angle = -entity.angle; }
        }

        // Clase Hormiga Reina (Controlable en Modo Normal)
        class QueenAnt {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 16;
                this.angle = 0;
                this.speed = 2.6;
                this.hp = 300;
                this.maxHp = 300;
                this.hasFood = false;
                this.walkCycle = 0;
                this.isMoving = false;
            }

            update() {
                this.isMoving = false;
                let moveX = 0;
                let moveY = 0;

                // Movimiento por teclado (WASD o Flechas)
                if (keysPressed['w'] || keysPressed['arrowup']) moveY -= 1;
                if (keysPressed['s'] || keysPressed['arrowdown']) moveY += 1;
                if (keysPressed['a'] || keysPressed['arrowleft']) moveX -= 1;
                if (keysPressed['d'] || keysPressed['arrowright']) moveX += 1;

                if (moveX !== 0 || moveY !== 0) {
                    queenTarget = null; // El teclado cancela el movimiento por clic
                    const desiredAngle = Math.atan2(moveY, moveX);
                    this.angle = this.lerpAngle(this.angle, desiredAngle, 0.25);
                    this.isMoving = true;
                } else if (queenTarget) {
                    const dx = queenTarget.x - this.x;
                    const dy = (queenTarget.y - this.y) / TILT;
                    const dist = Math.hypot(dx, dy);

                    if (dist > 6) {
                        const desiredAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, desiredAngle, 0.22);
                        this.isMoving = true;
                    } else {
                        queenTarget = null;
                    }
                }

                if (this.isMoving) {
                    this.walkCycle += this.speed * 0.28;
                    let nextX = this.x + Math.cos(this.angle) * this.speed;
                    let nextY = this.y + Math.sin(this.angle) * this.speed * TILT;

                    // Deslizamiento suave contra obstáculos para control del jugador
                    if (!checkObstacleCollision(nextX, nextY, 8)) {
                        this.x = nextX;
                        this.y = nextY;
                    } else if (!checkObstacleCollision(nextX, this.y, 8)) {
                        this.x = nextX;
                    } else if (!checkObstacleCollision(this.x, nextY, 8)) {
                        this.y = nextY;
                    }

                    const margin = 25;
                    this.x = Math.max(margin, Math.min(canvas.width - margin, this.x));
                    this.y = Math.max(margin, Math.min(canvas.height - margin, this.y));
                }

                // Recoger comida al pasar cerca
                if (!this.hasFood) {
                    for (let i = foods.length - 1; i >= 0; i--) {
                        let f = foods[i];
                        let dist = Math.hypot(f.x - this.x, (f.y - this.y) / TILT);
                        if (dist < 18) {
                            this.hasFood = true;
                            f.amount--;
                            if (f.amount <= 0) foods.splice(i, 1);
                            spawnHitParticles(this.x, this.y, '#ffccd5', 6);
                            statusEl.textContent = "🍓 ¡Comida recogida! Llévala a tu Colonia para poner un huevo";
                            break;
                        }
                    }
                } else if (antNests.length > 0) {
                    // Entregar comida en la colonia para poner un huevo de 30 segundos
                    let nest = antNests[0];
                    let dist = Math.hypot(nest.x - this.x, (nest.y - this.y) / TILT);
                    if (dist < nest.radius + 8) {
                        this.hasFood = false;
                        storedFood += 1;
                        // Colocar huevo dentro de la colonia (tarda 30 segundos = 1800 frames a 60fps)
                        const offsetAngle = Math.random() * Math.PI * 2;
                        const offsetR = Math.random() * 12;
                        eggs.push({
                            x: nest.x + Math.cos(offsetAngle) * offsetR,
                            y: nest.y + Math.sin(offsetAngle) * offsetR * TILT,
                            nest: nest,
                            timer: 30, // 30 segundos
                            maxTimer: 30
                        });
                        spawnHitParticles(nest.x, nest.y, '#ffd166', 10);
                        statusEl.textContent = "🥚 ¡Huevo puesto! Eclosionará en 30 segundos";
                        updateUI();
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Anillo indicador de selección bajo la Reina
                ctx.strokeStyle = 'rgba(255, 209, 102, 0.7)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(0, 2, 20, 20 * TILT, 0, 0, Math.PI * 2);
                ctx.stroke();

                // Sombra 2.5D
                ctx.fillStyle = 'rgba(0,0,0,0.42)';
                ctx.beginPath();
                ctx.ellipse(3, 6, 13, 6.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(1, TILT);
                ctx.rotate(this.angle);

                // Patas más largas y robustas que las obreras
                ctx.strokeStyle = '#1f0c06';
                ctx.lineWidth = 2;
                let legSwing = this.isMoving ? Math.sin(this.walkCycle) * 5 : 0;
                ctx.beginPath();
                ctx.moveTo(-4, -5); ctx.lineTo(-9 + legSwing, -18);
                ctx.moveTo(0, -5); ctx.lineTo(2 - legSwing, -20);
                ctx.moveTo(4, -5); ctx.lineTo(10 + legSwing, -18);
                ctx.moveTo(-4, 5); ctx.lineTo(-9 - legSwing, 18);
                ctx.moveTo(0, 5); ctx.lineTo(2 + legSwing, 20);
                ctx.moveTo(4, 5); ctx.lineTo(10 - legSwing, 18);
                ctx.stroke();

                // Abdomen real grande (gaster)
                ctx.fillStyle = '#3d1308';
                ctx.beginPath();
                ctx.ellipse(-9, 0, 8.5, 5.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Franjas doradas en el abdomen real
                ctx.strokeStyle = '#e09f3e';
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(-9, -4.5); ctx.lineTo(-9, 4.5);
                ctx.moveTo(-12, -3.8); ctx.lineTo(-12, 3.8);
                ctx.stroke();

                // Tórax robusto
                ctx.fillStyle = '#5e2110';
                ctx.beginPath();
                ctx.ellipse(0, 0, 4.8, 3.6, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cabeza real
                ctx.fillStyle = '#4a1c0e';
                ctx.beginPath();
                ctx.ellipse(7.5, 0, 4.2, 3.8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Pequeña corona dorada sobre la cabeza
                ctx.fillStyle = '#ffd166';
                ctx.beginPath();
                ctx.moveTo(6, -3);
                ctx.lineTo(8, -6);
                ctx.lineTo(9.5, -3);
                ctx.lineTo(11, -5.5);
                ctx.lineTo(11, 0);
                ctx.lineTo(6, 0);
                ctx.closePath();
                ctx.fill();

                // Comida transportada
                if (this.hasFood) {
                    ctx.fillStyle = '#ff2a55';
                    ctx.beginPath();
                    ctx.arc(14, 0, 4.8, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffccd5';
                    ctx.beginPath();

                        ctx.beginPath();
                        ctx.moveTo(-3, 0); ctx.lineTo(-16 + swing * i, i * 21);
                        ctx.moveTo(-1, 0); ctx.lineTo(-7 - swing * i, i * 23);
                        ctx.moveTo(2, 0); ctx.lineTo(9 + swing * i, i * 22);
                        ctx.moveTo(4, 0); ctx.lineTo(17 - swing * i, i * 18);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#161616';
                    ctx.beginPath();
                    ctx.arc(-7, 0, 11.5, 0, Math.PI * 2);
                    ctx.arc(7, 0, 7.8, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.moveTo(-8, -4); ctx.lineTo(-3, 0); ctx.lineTo(-8, 4); ctx.lineTo(-13, 0);
                    ctx.fill();

                    ctx.fillStyle = '#ff0054';
                    ctx.fillRect(13, -3.5, 2.2, 2.2);
                    ctx.fillRect(13, 1.3, 2.2, 2.2);
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function checkAutoSpawn() {
            if (gameMode === 'normal') return; // En modo normal los nacimientos son por huevos de la reina
            if (foodSpawnCounter >= 10) {
                foodSpawnCounter -= 10;
                let spawnAnts = antNests.length > 0 && (termiteNests.length === 0 || Math.random() > 0.5);
                if (spawnAnts && antNests.length > 0) {
                    let nest = antNests[Math.floor(Math.random() * antNests.length)];
                    ants.push(new Ant(nest.x, nest.y, nest));
                } else if (termiteNests.length > 0) {
                    let nest = termiteNests[Math.floor(Math.random() * termiteNests.length)];
                    termites.push(new Termite(nest.x, nest.y, nest));
                }
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            dirtPatches = [];
            pebbles = [];
            mushrooms = [];
            ferns = [];
            logs = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];
            beetles = [];

            for (let i = 0; i < 45; i++) {
                dirtPatches.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    rx: 65 + Math.random() * 85,
                    ry: (45 + Math.random() * 65) * TILT,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 320; i++) {
                pebbles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 1.5 + Math.random() * 3.5,
                    color: Math.random() > 0.5 ? '#58615d' : '#7f8a86'
                });
            }

            for (let i = 0; i < 30; i++) {
                mushrooms.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    color: Math.random() > 0.5 ? '#e76f51' : '#f4a261',
                    size: 3.5 + Math.random() * 3
                });
            }

            const grassColors = ['#224215', '#346221', '#487d2e'];
            for (let i = 0; i < 4000; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 6 + Math.random() * 9,
                    lean: (Math.random() - 0.5) * 6,
                    color: grassColors[Math.floor(Math.random() * grassColors.length)]
                });
            }

            for (let i = 0; i < 60; i++) {
                ferns.push({
                    x: 60 + Math.random() * (canvas.width - 120),
                    y: 60 + Math.random() * (canvas.height - 120),
                    size: 20 + Math.random() * 14,
                    angle: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i < 14; i++) {
                logs.push({
                    x: 180 + Math.random() * (canvas.width - 360),
                    y: 180 + Math.random() * (canvas.height - 360),
                    w: 105 + Math.random() * 70,
                    h: 30 + Math.random() * 14,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 28; i++) {
                let rx = 120 + Math.random() * (canvas.width - 240);
                let ry = 120 + Math.random() * (canvas.height - 240);
                let radius = 26 + Math.random() * 28;
                if (!isCollidingWithLog(rx, ry, 55)) {
                    let points = [];
                    let numVerts = 7 + Math.floor(Math.random() * 5);
                    for (let v = 0; v < numVerts; v++) {
                        let a = (v / numVerts) * Math.PI * 2;
                        let dist = radius * (0.75 + Math.random() * 0.5);
                        points.push({ x: Math.cos(a) * dist, y: Math.sin(a) * dist * TILT });
                    }
                    rocks.push({ x: rx, y: ry, radius: radius, points: points, hasMoss: Math.random() > 0.3 });
                }
            }

            const flowerColors = ['#ffb703', '#fb8500', '#ffffff', '#e0a96d', '#9b5de5', '#00bbf9'];
            for (let i = 0; i < 150; i++) {
                flowers.push({
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: 50 + Math.random() * (canvas.height - 100),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 26; i++) {
                const bx = 90 + Math.random() * (canvas.width - 180);
                const by = 90 + Math.random() * (canvas.height - 180);
                let radius = 32 + Math.random() * 16;
                let lobes = [];
                let numLobes = 4 + Math.floor(Math.random() * 3);
                for (let l = 0; l < numLobes; l++) {
                    let la = (l / numLobes) * Math.PI * 2;
                    let dist = radius * 0.32 * Math.random();
                    lobes.push({ x: Math.cos(la) * dist, y: Math.sin(la) * dist * TILT, r: radius * (0.6 + Math.random() * 0.4) });
                }
                bushes.push({ x: bx, y: by, radius: radius, lobes: lobes });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 65, by + (Math.random() - 0.5) * 65, 12);
            }

            for (let i = 0; i < 20; i++) {
                const tx = 140 + Math.random() * (canvas.width - 280);
                const ty = 140 + Math.random() * (canvas.height - 280);
                let radius = 68 + Math.random() * 30;
                let lobes = [];
                let numLobes = 5 + Math.floor(Math.random() * 3);
                for (let l = 0; l < numLobes; l++) {
                    let la = (l / numLobes) * Math.PI * 2;
                    let dist = radius * 0.36 * Math.random();
                    lobes.push({ x: Math.cos(la) * dist, y: Math.sin(la) * dist * TILT, r: radius * (0.65 + Math.random() * 0.35) });
                }
                trees.push({ x: tx, y: ty, radius: radius, lobes: lobes });
            }
        }

        function init() {
            antNests = [];
            termiteNests = [];
            ants = [];
            termites = [];
            beetles = [];
            enemies = [];
            webs = [];
            pheromones = [];
            particles = [];
            eggs = [];
            queen = null;
            queenTarget = null;
            foodSpawnCounter = 0;
            generateEnvironment();

            if (gameMode === 'normal') {
                storedFood = 0;
                const btnQueen = document.getElementById('tool-queen');
                const btnNormalNest = document.getElementById('tool-normal_nest');
                btnQueen.disabled = false;
                btnNormalNest.disabled = true;
                btnNormalNest.textContent = "🏠 Colocar Colonia (0/1)";
                setTool('queen');
            } else {
                storedFood = 100;
                setTool('nest');
            }
            updateUI();
        }

        function placeNest(x, y, type) {
            let newNest = { x, y, radius: 26 };
            if (type === 'ant') {
                antNests.push(newNest);
                if (gameMode === 'sandbox') {
                    for (let i = 0; i < 8; i++) ants.push(new Ant(x, y, newNest));
                }
            } else {
                termiteNests.push(newNest);
                for (let i = 0; i < 6; i++) termites.push(new Termite(x, y, newNest));
            }
            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60 * TILT;
                let fx = Math.max(30, Math.min(canvas.width - 30, x + offsetX));
                let fy = Math.max(30, Math.min(canvas.height - 30, y + offsetY));
                if (!checkObstacleCollision(fx, fy, 4)) {
                    foods.push({ x: fx, y: fy, amount: 5 });
                }
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length + (queen ? 1 : 0);
            termiteEl.textContent = termites.length;
            enemyEl.textContent = enemies.length;
            eggEl.textContent = eggs.length;
            nestEl.textContent = antNests.length + termiteNests.length;
            progressEl.textContent = `${foodSpawnCounter}/10 🍓`;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            // Lógica en Modo Normal (Historia)
            if (gameMode === 'normal') {
                if (currentTool === 'queen' && !queen) {
                    if (!canPlaceAt(clickX, clickY, 'queen')) {
                        statusEl.textContent = "⚠️ No puedes colocar a la Reina encima de rocas o troncos";
                        statusEl.style.background = "linear-gradient(90deg, #9b2226, #ae2012)";
                        return;
                    }
                    queen = new QueenAnt(clickX, clickY);
                    document.getElementById('tool-queen').disabled = true;
                    const btnNormalNest = document.getElementById('tool-normal_nest');
                    btnNormalNest.disabled = false;
                    setTool('normal_nest');
                    updateUI();
                    return;
                }

                if (currentTool === 'normal_nest' && antNests.length === 0) {
                    if (!canPlaceAt(clickX, clickY, 'normal_nest')) {
                        statusEl.textContent = "⚠️ Espacio bloqueado para fundar la Colonia";
                        statusEl.style.background = "linear-gradient(90deg, #9b2226, #ae2012)";
                        return;
                    }
                    placeNest(clickX, clickY, 'ant');
                    const btnNormalNest = document.getElementById('tool-normal_nest');
                    btnNormalNest.disabled = true;
                    btnNormalNest.textContent = "🏠 Colonia Fundada (1/1)";
                    setTool('control_queen');
                    return;
                }

                // Si ya existe la Reina y se hace clic en el mapa, mover la Reina allí
                if (queen) {
                    queenTarget = { x: clickX, y: clickY };
                    spawnHitParticles(clickX, clickY, '#ffd166', 4);
                }
                return;
            }

            // Lógica en Modo Sandbox
            if (!canPlaceAt(clickX, clickY, currentTool)) {
                statusEl.textContent = "⚠️ Espacio bloqueado por obstáculos o entidades";
                statusEl.style.background = "linear-gradient(90deg, #9b2226, #ae2012)";
                return;
            }

            statusEl.textContent = toolDescriptions[currentTool];
            statusEl.style.background = "linear-gradient(90deg, #2d6a4f, #40916c)";

            if (currentTool === 'nest') {
                placeNest(clickX, clickY, 'ant');
            } else if (currentTool === 'termite_nest') {
                placeNest(clickX, clickY, 'termite');
            } else if (currentTool === 'beetle') {
                beetles.push(new Beetle(clickX, clickY));
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            }
            updateUI();
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            ctx.fillStyle = '#345822';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let d of dirtPatches) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.angle);
                ctx.fillStyle = 'rgba(67, 40, 24, 0.45)';
                ctx.beginPath();
                ctx.ellipse(0, 0, d.rx, d.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let p of pebbles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.r, p.r * TILT, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let m of mushrooms) {
                ctx.fillStyle = '#fefae0';
                ctx.fillRect(m.x - 1.2, m.y - 3, 2.4, m.size + 3);
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.ellipse(m.x, m.y - 3, m.size, m.size * 0.7, 0, Math.PI, Math.PI * 2);
                ctx.fill();
            }

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + g.lean, g.y - g.h);
                ctx.stroke();
            }

            for (let fn of ferns) {
                ctx.save();
                ctx.translate(fn.x, fn.y);
                ctx.scale(1, TILT);
                ctx.rotate(fn.angle);
                ctx.strokeStyle = '#1b4332';
                ctx.lineWidth = 2.2;
                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(fn.size, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            for (let l of logs) {
                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.scale(1, TILT);
                ctx.rotate(l.angle);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.roundRect(-l.w/2 + 8, -l.h/2 + 10, l.w, l.h, 8);
                ctx.fill();

                ctx.fillStyle = '#432818';
                ctx.beginPath();
                ctx.roundRect(-l.w/2, -l.h/2, l.w, l.h, 8);
                ctx.fill();

                ctx.fillStyle = '#bb9457';
                ctx.beginPath();
                ctx.ellipse(l.w/2 - 2, 0, 6, l.h/2 - 1, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#386641';
                ctx.beginPath();
                ctx.ellipse(-10, -l.h/3, l.w * 0.32, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 2.5) {
                    ctx.beginPath();
                    ctx.ellipse(fl.x + Math.cos(a) * 2.8, fl.y + Math.sin(a) * 2.8 * TILT, 2, 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#3d1e00';
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r of rocks) {
                ctx.save();
                ctx.translate(r.x, r.y);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x + 8, r.points[0].y + 12);
                for (let pt of r.points) ctx.lineTo(pt.x + 8, pt.y + 12);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#3d4542';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x, r.points[0].y + 6);
                for (let pt of r.points) ctx.lineTo(pt.x, pt.y + 6);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = '#6c757d';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x, r.points[0].y - 3);
                for (let pt of r.points) ctx.lineTo(pt.x, pt.y - 3);
                ctx.closePath();
                ctx.fill();

                if (r.hasMoss) {
                    ctx.fillStyle = '#386641';
                    ctx.beginPath();
                    ctx.ellipse(r.radius * 0.15, -r.radius * 0.25 * TILT - 3, r.radius * 0.42, r.radius * 0.28, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.save();
                ctx.translate(b.x, b.y);

                ctx.fillStyle = 'rgba(0,0,0,0.38)';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x + 8, lob.y + 12, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#1b4332';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x, lob.y, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#2d6a4f';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x - 3, lob.y - 5, lob.r * 0.72, lob.r * 0.72 * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            for (let t of trees) {
                ctx.save();
                ctx.translate(t.x, t.y);

                ctx.fillStyle = 'rgba(4, 12, 2, 0.42)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x + 28, lob.y + 34, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#3d1e00';
                ctx.fillRect(-10, -25, 20, 32);
                ctx.beginPath();
                ctx.ellipse(0, 7, 13, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(18, 53, 20, 0.9)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x, lob.y - 25, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(45, 106, 79, 0.8)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x - 8, lob.y - 32, lob.r * 0.7, lob.r * 0.7 * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function loop() {
            let needsUIUpdate = false;

            for (let s = 0; s < gameSpeed; s++) {
                // Actualizar Reina en Modo Normal
                if (queen) queen.update();

                // Actualizar huevos (30 segundos = 1/60s por frame)
                for (let i = eggs.length - 1; i >= 0; i--) {
                    eggs[i].timer -= 1 / 60;
                    if (eggs[i].timer <= 0) {
                        const hatched = eggs.splice(i, 1)[0];
                        ants.push(new Ant(hatched.nest.x, hatched.nest.y, hatched.nest));
                        spawnHitParticles(hatched.nest.x, hatched.nest.y, '#b5e48c', 12);
                        statusEl.textContent = "🐜 ¡Un huevo ha eclosionado! Nació una nueva hormiga obrera";
                        needsUIUpdate = true;
                    }
                }

                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let pt = particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life--;
                    if (pt.life <= 0) particles.splice(i, 1);
                }

                for (let i = webs.length - 1; i >= 0; i--) {
                    let w = webs[i];
                    w.x += Math.cos(w.angle) * w.speed;
                    w.y += Math.sin(w.angle) * w.speed * TILT;
                    w.life--;

                    let hit = false;
                    for (let ant of ants) {
                        if (Math.hypot(ant.x - w.x, (ant.y - w.y) / TILT) < 14) {
                            ant.slowTimer = 200;
                            hit = true;
                            break;
                        }
                    }
                    if (!hit) {
                        for (let t of termites) {
                            if (Math.hypot(t.x - w.x, (t.y - w.y) / TILT) < 14) {
                                t.slowTimer = 200;
                                hit = true;
                                break;
                            }
                        }
                    }

                    if (hit || w.life <= 0 || checkObstacleCollision(w.x, w.y, 2)) {
                        webs.splice(i, 1);
                    }
                }

                for (let ant of ants) ant.update();
                for (let t of termites) t.update();
                for (let b of beetles) b.update();
                for (let en of enemies) en.update();

                for (let i = ants.length - 1; i >= 0; i--) {
                    if (ants[i].hp <= 0) {
                        foods.push({ x: ants[i].x, y: ants[i].y, amount: 2 });
                        ants.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = termites.length - 1; i >= 0; i--) {
                    if (termites[i].hp <= 0) {
                        foods.push({ x: termites[i].x, y: termites[i].y, amount: 3 });
                        termites.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = beetles.length - 1; i >= 0; i--) {
                    if (beetles[i].hp <= 0) {
                        spawnFoodCluster(beetles[i].x, beetles[i].y, 6);
                        beetles.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        let drop = enemies[i].type === 'mantis' ? 30 : 15;
                        spawnFoodCluster(enemies[i].x, enemies[i].y, Math.ceil(drop / 3));
                        enemies.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }
            }

            if (needsUIUpdate) updateUI();

            // 1. Suelo y relieves 2.5D
            drawEnvironmentBase();

            // 2. Feromonas
            for (let p of pheromones) {
                ctx.fillStyle = `rgba(200, 240, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 2.2, 1.6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Marcador destino de la Reina (si el jugador hizo clic)
            if (queen && queenTarget) {
                ctx.strokeStyle = 'rgba(255, 209, 102, 0.85)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.ellipse(queenTarget.x, queenTarget.y, 10, 10 * TILT, 0, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 4. Comida con volumen 3D
            for (let f of foods) {
                let r = 2.8 + f.amount * 0.55;
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(f.x + 1, f.y + 2, r, r * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y - 1.5, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffccd5';
                ctx.beginPath();
                ctx.arc(f.x - 1, f.y - 2.5, 1.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 5. Telarañas
            for (let w of webs) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 4.5, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 6. Hormigueros en relieve 2.5D
            for (let n of antNests) {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.ellipse(n.x + 4, n.y + 6, n.radius + 9, (n.radius + 9) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#582f0e';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y, n.radius + 8, (n.radius + 8) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#7f4f24';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y - 3, n.radius + 4, (n.radius + 4) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0b0503';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y - 4, n.radius - 6, (n.radius - 6) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 7. Huevos dentro de la Colonia y contador de 30s
            for (let egg of eggs) {
                ctx.fillStyle = '#fefae0';
                ctx.beginPath();
                ctx.ellipse(egg.x, egg.y - 3, 4.5, 3.2, 0.2, 0, Math.PI * 2);
                ctx.fill();

                // Barra circular/texto de cuenta atrás
                ctx.fillStyle = '#ffd166';
                ctx.font = 'bold 11px Segoe UI';
                ctx.textAlign = 'center';
                ctx.fillText(`${Math.ceil(egg.timer)}s`, egg.x, egg.y - 10);
            }

            // 8. Termiteros
            for (let n of termiteNests) {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.ellipse(n.x + 5, n.y + 7, n.radius + 10, (n.radius + 10) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#774936';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y, n.radius + 9, (n.radius + 9) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#9c6644';
                ctx.beginPath();
                ctx.ellipse(n.x - 2, n.y - 9, n.radius * 0.65, n.radius * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2e190a';
                ctx.beginPath();
                ctx.ellipse(n.x + 4, n.y + 2, 5.5, 4, 0, 0, Math.PI * 2);
                ctx.ellipse(n.x - 7, n.y + 3, 4.5, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 9. Ordenar entidades por profundidad Y
            let allEntities = [...ants, ...termites, ...beetles, ...enemies];
            if (queen) allEntities.push(queen);
            allEntities.sort((a, b) => a.y - b.y);
            for (let ent of allEntities) ent.draw();

            // 10. Partículas
            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 11. Copas de árboles y arbustos
            drawCanopyLayer();

            // 12. Iluminación del bosque
            let sunGrad = ctx.createRadialGradient(canvas.width * 0.3, canvas.height * 0.2, 100, canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.8);
            sunGrad.addColorStop(0, 'rgba(255, 243, 176, 0.08)');
            sunGrad.addColorStop(1, 'rgba(6, 15, 5, 0.32)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 13. Previsualización del cursor (solo cuando toca colocar algo)
            const showCursorPreview = (gameMode === 'sandbox') || (currentTool === 'queen' && !queen) || (currentTool === 'normal_nest' && antNests.length === 0);
            if (showCursorPreview) {
                const validPlacement = canPlaceAt(mousePos.x, mousePos.y, currentTool);
                const previewRadius = (currentTool === 'nest' || currentTool === 'termite_nest' || currentTool === 'normal_nest') ? 28 : (currentTool === 'mantis') ? 22 : (currentTool === 'spider' || currentTool === 'beetle' || currentTool === 'queen') ? 16 : 14;

                ctx.strokeStyle = validPlacement ? 'rgba(181, 228, 140, 0.95)' : 'rgba(255, 77, 109, 0.98)';
                ctx.fillStyle = validPlacement ? 'rgba(181, 228, 140, 0.2)' : 'rgba(255, 77, 109, 0.3)';
                ctx.setLineDash([5, 4]);
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.ellipse(mousePos.x, mousePos.y, previewRadius, previewRadius * TILT, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.setLineDash([]);
            }

            requestAnimationFrame(loop);
        }

        // Generar entorno de fondo mientras se muestra la pantalla de título
        generateEnvironment();
        loop();
    </script>
</body>
</html>

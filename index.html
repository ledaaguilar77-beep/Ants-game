<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema Gigante: Guerra de Insectos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0c100a;
            color: #eef5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
        }
        header {
            text-align: center;
            margin-bottom: 4px;
        }
        h1 { font-size: 1.3rem; color: #a7c957; }
        #status-msg {
            font-size: 0.8rem;
            color: #f2e8cf;
            background: #386641;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 2px;
            font-weight: bold;
            transition: background 0.2s;
        }
        
        .hud {
            display: flex;
            gap: 10px;
            background: #172114;
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid #4f6d45;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat { font-weight: bold; font-size: 0.85rem; }
        .stat span { color: #a7c957; }
        
        .toolbar {
            display: flex;
            gap: 5px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background-color: #4a7c36;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #6a994e; }
        button:active { transform: scale(0.95); }
        button.active {
            background-color: #bc4749;
            box-shadow: 0 0 6px rgba(255,255,255,0.5);
        }
        button:disabled {
            background-color: #262e24;
            color: #5c6658;
            cursor: not-allowed;
        }
        .btn-termite { background-color: #bc6c25; }
        .btn-termite:hover { background-color: #dda15e; }
        .btn-predator { background-color: #6a040f; }
        .btn-predator:hover { background-color: #9d0208; }
        .btn-danger { background-color: #780000; }

        canvas {
            background-color: #355823;
            border: 3px solid #1c2b14;
            border-radius: 8px;
            cursor: crosshair;
            box-shadow: 0 8px 20px rgba(0,0,0,0.9);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Ecosistema Masivo: Hormigas vs Termitas y Arañas Teje-redes</h1>
        <div id="status-msg">🏠 Colocar Nido de Hormigas (Haz clic en terreno despejado)</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">80</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat">🏗️ Termitas: <span id="termite-count">0</span></div>
        <div class="stat">🏰 Nidos: <span id="nest-count">0</span></div>
        <button id="btn-spawn-ant" disabled>Crear Hormiga (10 🍓)</button>
        <button id="btn-spawn-termite" disabled>Crear Termita (10 🍓)</button>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Nuevo Mapa</button>
    </div>

    <div class="toolbar">
        <button id="tool-nest" class="active" onclick="setTool('nest')">🏠 Nido Hormigas</button>
        <button id="tool-termite_nest" class="btn-termite" onclick="setTool('termite_nest')">🏰 Nido Termitas</button>
        <button id="tool-food" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="btn-predator" onclick="setTool('spider')">🕷️ Araña (Teje-redes)</button>
        <button id="tool-mantis" class="btn-predator" onclick="setTool('mantis')">🦗 Mantis Alfa</button>
    </div>

    <!-- Mapa Gigante 2000x1200 -->
    <canvas id="gameCanvas" width="2000" height="1200"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const termiteEl = document.getElementById('termite-count');
        const nestEl = document.getElementById('nest-count');
        const statusEl = document.getElementById('status-msg');
        const btnSpawnAnt = document.getElementById('btn-spawn-ant');
        const btnSpawnTermite = document.getElementById('btn-spawn-termite');
        const btnSpeed = document.getElementById('btn-speed');

        let currentTool = 'nest';
        let storedFood = 80;
        let antNests = [];
        let termiteNests = [];
        let ants = [];
        let termites = [];
        let enemies = [];
        let webs = []; // Proyectiles de telaraña
        let foods = [];
        let pheromones = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        let grassBlades = [];
        let dirtPatches = [];
        let pebbles = [];
        let ferns = [];
        let logs = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        const toolDescriptions = {
            nest: "🏠 Colocar Nido de Hormigas (Haz clic en terreno despejado)",
            termite_nest: "🏰 Colocar Nido de Termitas (Montículo de arcilla)",
            food: "🍓 Soltar Comida (Alimenta a las colonias)",
            spider: "🕷️ Invocar Araña (Lanza telarañas para atrapar presas)",
            mantis: "🦗 Invocar Mantis Religiosa (Depredador alfa gigante)"
        };

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`tool-${tool}`).classList.add('active');
            statusEl.textContent = toolDescriptions[tool];
            statusEl.style.background = "#386641";
        }

        function isCollidingWithLog(x, y, margin) {
            for (let l of logs) {
                const dx = x - l.x;
                const dy = y - l.y;
                const cos = Math.cos(-l.angle);
                const sin = Math.sin(-l.angle);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;
                if (Math.abs(localX) < l.w / 2 + margin && Math.abs(localY) < l.h / 2 + margin) return true;
            }
            return false;
        }

        function canPlaceAt(x, y, tool) {
            if (x < 40 || x > canvas.width - 40 || y < 40 || y > canvas.height - 40) return false;
            const reqRadius = (tool === 'nest' || tool === 'termite_nest') ? 26 : (tool === 'mantis') ? 22 : (tool === 'spider') ? 16 : 12;

            for (let r of rocks) {
                if (Math.hypot(x - r.x, y - r.y) < r.radius + reqRadius) return false;
            }
            if (isCollidingWithLog(x, y, reqRadius)) return false;
            for (let n of antNests) {
                if (Math.hypot(x - n.x, y - n.y) < n.radius + reqRadius + 8) return false;
            }
            for (let n of termiteNests) {
                if (Math.hypot(x - n.x, y - n.y) < n.radius + reqRadius + 8) return false;
            }
            if (tool !== 'food') {
                for (let en of enemies) {
                    if (Math.hypot(x - en.x, y - en.y) < en.radius + reqRadius + 4) return false;
                }
            }
            if (tool === 'nest' || tool === 'termite_nest') {
                for (let a of ants) {
                    if (Math.hypot(x - a.x, y - a.y) < reqRadius) return false;
                }
                for (let t of termites) {
                    if (Math.hypot(x - t.x, y - t.y) < reqRadius) return false;
                }
            }
            return true;
        }

        function checkObstacleCollision(x, y, radius) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, y - rock.y) < rock.radius + radius) return true;
            }
            if (isCollidingWithLog(x, y, radius)) return true;
            return false;
        }

        class Ant {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2.0;
                this.hp = 22;
                this.maxHp = 22;
                this.damage = 0.65;
                this.hasFood = false;
                this.pheromoneTimer = 0;
                this.slowTimer = 0; // Efecto de telaraña
            }

            update() {
                let currentSpeed = this.slowTimer > 0 ? this.speed * 0.35 : this.speed;
                if (this.slowTimer > 0) this.slowTimer--;

                let target = null;
                let minDist = 90;

                if (!this.hasFood) {
                    for (let t of termites) {
                        let d = Math.hypot(t.x - this.x, t.y - this.y);
                        if (d < minDist) { minDist = d; target = t; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, en.y - this.y);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);

                    if (minDist < target.radius + 6) {
                        target.hp -= this.damage;
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.45;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        this.pheromoneTimer++;
                        if (this.pheromoneTimer % 6 === 0) {
                            pheromones.push({ x: this.x, y: this.y, life: 350 });
                        }

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 2;
                            this.hp = Math.min(this.maxHp, this.hp + 5);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        let foundTarget = false;
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 80) {
                                let targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);
                                foundTarget = true;

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }

                        if (!foundTarget && pheromones.length > 0) {
                            let bestPheromone = null;
                            let maxLife = 0;

                            for (let p of pheromones) {
                                let dist = Math.hypot(p.x - this.x, p.y - this.y);
                                if (dist > 10 && dist < 65) {
                                    let angleToP = Math.atan2(p.y - this.y, p.x - this.x);
                                    let diff = Math.abs(this.normalizeAngle(angleToP - this.angle));
                                    if (diff < 1.1 && p.life > maxLife) {
                                        maxLife = p.life;
                                        bestPheromone = p;
                                    }
                                }
                            }

                            if (bestPheromone) {
                                let targetAngle = Math.atan2(bestPheromone.y - this.y, bestPheromone.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);
                            }
                        }
                    }
                }

                let nextX = this.x + Math.cos(this.angle) * currentSpeed;
                let nextY = this.y + Math.sin(this.angle) * currentSpeed;

                if (checkObstacleCollision(nextX, nextY, 4)) {
                    this.angle += (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2);
                    nextX = this.x + Math.cos(this.angle) * currentSpeed;
                    nextY = this.y + Math.sin(this.angle) * currentSpeed;
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Patas articuladas detalladas
                ctx.strokeStyle = '#140804';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-2, -3); ctx.lineTo(-4, -9);
                ctx.moveTo(0, -3); ctx.lineTo(1, -10);
                ctx.moveTo(2, -3); ctx.lineTo(5, -9);
                ctx.moveTo(-2, 3); ctx.lineTo(-4, 9);
                ctx.moveTo(0, 3); ctx.lineTo(1, 10);
                ctx.moveTo(2, 3); ctx.lineTo(5, 9);
                ctx.stroke();

                // Cuerpo de hormiga estilizado
                ctx.fillStyle = '#2b120a';
                ctx.beginPath();
                ctx.ellipse(-4.5, 0, 3.5, 2.2, 0, 0, Math.PI * 2); // Abdomen
                ctx.ellipse(0, 0, 2.2, 1.5, 0, 0, Math.PI * 2);   // Tórax
                ctx.ellipse(3.8, 0, 2.2, 1.9, 0, 0, Math.PI * 2); // Cabeza
                ctx.fill();

                // Brillo en el abdomen
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.ellipse(-5, -0.8, 1.5, 0.8, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(7, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.slowTimer > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Termite {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.8;
                this.hp = 25;
                this.maxHp = 25;
                this.damage = 0.7;
                this.hasFood = false;
                this.slowTimer = 0;
            }

            update() {
                let currentSpeed = this.slowTimer > 0 ? this.speed * 0.35 : this.speed;
                if (this.slowTimer > 0) this.slowTimer--;

                let target = null;
                let minDist = 85;

                if (!this.hasFood) {
                    for (let ant of ants) {
                        let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                        if (d < minDist) { minDist = d; target = ant; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, en.y - this.y);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);

                    if (minDist < target.radius + 6) {
                        target.hp -= this.damage;
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.4;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = this.nest.y - this.y;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 1;
                            this.hp = Math.min(this.maxHp, this.hp + 5);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, f.y - this.y);
                            
                            if (dist < 75) {
                                let targetAngle = Math.atan2(f.y - this.y, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.22);

                                if (dist < 8) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }
                    }
                }

                let nextX = this.x + Math.cos(this.angle) * currentSpeed;
                let nextY = this.y + Math.sin(this.angle) * currentSpeed;

                if (checkObstacleCollision(nextX, nextY, 4)) {
                    this.angle += (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2);
                    nextX = this.x + Math.cos(this.angle) * currentSpeed;
                    nextY = this.y + Math.sin(this.angle) * currentSpeed;
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 15) { this.x = 15; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 15) { this.x = canvas.width - 15; this.angle = Math.PI - this.angle; }
                if (this.y < 15) { this.y = 15; this.angle = -this.angle; }
                if (this.y > canvas.height - 15) { this.y = canvas.height - 15; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Diseño detallado de termita
                ctx.fillStyle = '#e3d5ca';
                ctx.beginPath();
                ctx.ellipse(-3.5, 0, 4.5, 2.8, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#bc6c25';
                ctx.beginPath();
                ctx.arc(3.2, 0, 3, 0, Math.PI * 2);
                ctx.fill();

                // Mandíbulas prominentes
                ctx.strokeStyle = '#7f4f24';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(6, -2); ctx.lineTo(9, -4);
                ctx.moveTo(6, 2); ctx.lineTo(9, 4);
                ctx.stroke();

                if (this.hasFood) {
                    ctx.fillStyle = '#e63946';
                    ctx.beginPath();
                    ctx.arc(7, 0, 2.8, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.slowTimer > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.lineWidth = 1.2;
                    ctx.beginPath();
                    ctx.arc(0, 0, 8, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.angle = Math.random() * Math.PI * 2;
                this.attackCooldown = 0;
                
                if (type === 'mantis') {
                    this.speed = 2.1;
                    this.radius = 20;
                    this.hp = 160;
                    this.maxHp = 160;
                    this.damage = 3.8;
                    this.sight = 260;
                } else { // spider teje-redes
                    this.speed = 1.6;
                    this.radius = 15;
                    this.hp = 80;
                    this.maxHp = 80;
                    this.damage = 2.0;
                    this.sight = 240;
                }
            }

            update() {
                if (this.attackCooldown > 0) this.attackCooldown--;

                let target = null;
                let minDist = this.sight;

                for (let other of enemies) {
                    if (other !== this && other.type !== this.type) {
                        let d = Math.hypot(other.x - this.x, other.y - this.y);
                        if (d < minDist) { minDist = d; target = other; }
                    }
                }
                for (let ant of ants) {
                    let d = Math.hypot(ant.x - this.x, ant.y - this.y);
                    if (d < minDist) { minDist = d; target = ant; }
                }
                for (let t of termites) {
                    let d = Math.hypot(t.x - this.x, t.y - this.y);
                    if (d < minDist) { minDist = d; target = t; }
                }

                if (target) {
                    let targetAngle = Math.atan2(target.y - this.y, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.16);

                    // Si es araña y el objetivo está a distancia media, dispara telaraña
                    if (this.type === 'spider' && minDist < 200 && minDist > 45 && this.attackCooldown === 0) {
                        webs.push({
                            x: this.x,
                            y: this.y,
                            angle: targetAngle,
                            speed: 4.5,
                            life: 70
                        });
                        this.attackCooldown = 90; // Cada 1.5 segundos aprox
                    }

                    if (minDist < this.radius + (target.radius || 4) + 4) {
                        target.hp -= this.damage;
                        if (target.hp <= 0) {
                            this.hp = Math.min(this.maxHp, this.hp + 20);
                        }
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.35;
                }

                let nextX = this.x + Math.cos(this.angle) * this.speed;
                let nextY = this.y + Math.sin(this.angle) * this.speed;

                if (checkObstacleCollision(nextX, nextY, this.radius * 0.7)) {
                    this.angle += (Math.random() > 0.5 ? 1 : -1) * (Math.PI / 2);
                    nextX = this.x + Math.cos(this.angle) * this.speed;
                    nextY = this.y + Math.sin(this.angle) * this.speed;
                }

                this.x = nextX;
                this.y = nextY;

                if (this.x < 25) { this.x = 25; this.angle = Math.PI - this.angle; }
                if (this.x > canvas.width - 25) { this.x = canvas.width - 25; this.angle = Math.PI - this.angle; }
                if (this.y < 25) { this.y = 25; this.angle = -this.angle; }
                if (this.y > canvas.height - 25) { this.y = canvas.height - 25; this.angle = -this.angle; }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                const barWidth = this.radius * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(-barWidth / 2, -this.radius - 12, barWidth, 4);
                ctx.fillStyle = this.type === 'mantis' ? '#ffbe0b' : '#e63946';
                ctx.fillRect(-barWidth / 2, -this.radius - 12, barWidth * Math.max(0, this.hp / this.maxHp), 4);

                ctx.rotate(this.angle);

                if (this.type === 'mantis') {
                    // Sombra
                    ctx.fillStyle = 'rgba(0,0,0,0.35)';
                    ctx.beginPath();
                    ctx.ellipse(-2, 5, 24, 9, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Guadañas delanteras detalladas
                    ctx.strokeStyle = '#52b788';
                    ctx.lineWidth = 3.5;
                    ctx.beginPath();
                    ctx.moveTo(8, -4); ctx.lineTo(24, -14); ctx.lineTo(18, -3);
                    ctx.moveTo(8, 4); ctx.lineTo(24, 14); ctx.lineTo(18, 3);
                    ctx.stroke();

                    // Cuerpo estilizado verde
                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.ellipse(-6, 0, 15, 6.5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#40916c';
                    ctx.beginPath();
                    ctx.ellipse(8, 0, 10, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#74c69d';
                    ctx.beginPath();
                    ctx.arc(18, 0, 5.5, 0, Math.PI * 2);
                    ctx.fill();

                    // Ojos compuestos amarillos
                    ctx.fillStyle = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(20, -4, 2.2, 0, Math.PI * 2);
                    ctx.arc(20, 4, 2.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Patas de araña detalladas con articulaciones
                    ctx.strokeStyle = '#111';
                    ctx.lineWidth = 2;
                    for (let i = -1; i <= 1; i += 2) {
                        ctx.beginPath();
                        ctx.moveTo(-2, 0); ctx.lineTo(-14, i * 18);
                        ctx.moveTo(0, 0); ctx.lineTo(-6, i * 20);
                        ctx.moveTo(2, 0); ctx.lineTo(8, i * 19);
                        ctx.moveTo(4, 0); ctx.lineTo(15, i * 15);
                        ctx.stroke();
                    }

                    // Abdomen y cefalotórax con textura de pelusa/brillo
                    ctx.fillStyle = '#1c1c1c';
                    ctx.beginPath();
                    ctx.arc(-6, 0, 10, 0, Math.PI * 2);
                    ctx.arc(6, 0, 7, 0, Math.PI * 2);
                    ctx.fill();

                    // Reloj de arena rojo característico de araña letal
                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.moveTo(-7, -3); ctx.lineTo(-4, 0); ctx.lineTo(-7, 3); ctx.lineTo(-10, 0);
                    ctx.fill();

                    // Múltiples ojos brillantes
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(11, -3, 2, 2);
                    ctx.fillRect(11, 1, 2, 2);
                    ctx.fillStyle = '#ff0000';
                    ctx.fillRect(10, -1, 1.5, 1.5);
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            dirtPatches = [];
            pebbles = [];
            ferns = [];
            logs = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];

            for (let i = 0; i < 35; i++) {
                dirtPatches.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    rx: 50 + Math.random() * 70,
                    ry: 35 + Math.random() * 50,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 250; i++) {
                pebbles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 1.5 + Math.random() * 3,
                    color: Math.random() > 0.5 ? '#555d5a' : '#828a87'
                });
            }

            const grassColors = ['#254417', '#3c6827', '#4b8231'];
            for (let i = 0; i < 3200; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 4 + Math.random() * 8,
                    lean: (Math.random() - 0.5) * 5,
                    color: grassColors[Math.floor(Math.random() * grassColors.length)]
                });
            }

            for (let i = 0; i < 45; i++) {
                ferns.push({
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: 50 + Math.random() * (canvas.height - 100),
                    size: 16 + Math.random() * 12,
                    angle: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i < 12; i++) {
                logs.push({
                    x: 150 + Math.random() * (canvas.width - 300),
                    y: 150 + Math.random() * (canvas.height - 300),
                    w: 90 + Math.random() * 60,
                    h: 26 + Math.random() * 12,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 24; i++) {
                let rx = 100 + Math.random() * (canvas.width - 200);
                let ry = 100 + Math.random() * (canvas.height - 200);
                if (!isCollidingWithLog(rx, ry, 50)) {
                    rocks.push({
                        x: rx,
                        y: ry,
                        radius: 22 + Math.random() * 25,
                        hasMoss: Math.random() > 0.35
                    });
                }
            }

            const flowerColors = ['#ffbe0b', '#ff006e', '#ffffff', '#fb5607', '#c77dff', '#4cc9f0'];
            for (let i = 0; i < 120; i++) {
                flowers.push({
                    x: 40 + Math.random() * (canvas.width - 80),
                    y: 40 + Math.random() * (canvas.height - 80),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 22; i++) {
                const bx = 80 + Math.random() * (canvas.width - 160);
                const by = 80 + Math.random() * (canvas.height - 160);
                bushes.push({ x: bx, y: by, radius: 28 + Math.random() * 14 });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 60, by + (Math.random() - 0.5) * 60, 10);
            }

            for (let i = 0; i < 18; i++) {
                trees.push({
                    x: 120 + Math.random() * (canvas.width - 240),
                    y: 120 + Math.random() * (canvas.height - 240),
                    radius: 60 + Math.random() * 25
                });
            }
        }

        function init() {
            antNests = [];
            termiteNests = [];
            ants = [];
            termites = [];
            enemies = [];
            webs = [];
            pheromones = [];
            storedFood = 80;
            generateEnvironment();
            updateUI();
            setTool('nest');
        }

        function placeNest(x, y, type) {
            let newNest = { x, y, radius: 24 };
            if (type === 'ant') {
                antNests.push(newNest);
                for (let i = 0; i < 8; i++) ants.push(new Ant(x, y, newNest));
            } else {
                termiteNests.push(newNest);
                for (let i = 0; i < 6; i++) termites.push(new Termite(x, y, newNest));
            }
            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 50;
                const offsetY = (Math.random() - 0.5) * 50;
                let fx = Math.max(25, Math.min(canvas.width - 25, x + offsetX));
                let fy = Math.max(25, Math.min(canvas.height - 25, y + offsetY));
                if (!checkObstacleCollision(fx, fy, 4)) {
                    foods.push({ x: fx, y: fy, amount: 5 });
                }
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length;
            termiteEl.textContent = termites.length;
            nestEl.textContent = antNests.length + termiteNests.length;
            btnSpawnAnt.disabled = antNests.length === 0 || storedFood < 10;
            btnSpawnTermite.disabled = termiteNests.length === 0 || storedFood < 10;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (!canPlaceAt(clickX, clickY, currentTool)) {
                statusEl.textContent = "⚠️ No puedes colocar esto encima de obstáculos, nidos o enemigos";
                statusEl.style.background = "#9b2226";
                return;
            }

            statusEl.textContent = toolDescriptions[currentTool];
            statusEl.style.background = "#386641";

            if (currentTool === 'nest') {
                placeNest(clickX, clickY, 'ant');
            } else if (currentTool === 'termite_nest') {
                placeNest(clickX, clickY, 'termite');
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            }
            updateUI();
        });

        btnSpawnAnt.addEventListener('click', () => {
            if (antNests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                let n = antNests[Math.floor(Math.random() * antNests.length)];
                ants.push(new Ant(n.x, n.y, n));
                updateUI();
            }
        });

        btnSpawnTermite.addEventListener('click', () => {
            if (termiteNests.length > 0 && storedFood >= 10) {
                storedFood -= 10;
                let n = termiteNests[Math.floor(Math.random() * termiteNests.length)];
                termites.push(new Termite(n.x, n.y, n));
                updateUI();
            }
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            ctx.fillStyle = '#355823';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let d of dirtPatches) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.angle);
                ctx.fillStyle = 'rgba(64, 43, 25, 0.38)';
                ctx.beginPath();
                ctx.ellipse(0, 0, d.rx, d.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let p of pebbles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + g.lean, g.y - g.h);
                ctx.stroke();
            }

            for (let fn of ferns) {
                ctx.save();
                ctx.translate(fn.x, fn.y);
                ctx.rotate(fn.angle);
                ctx.strokeStyle = '#224a15';
                ctx.lineWidth = 2;
                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(fn.size, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            for (let l of logs) {
                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.rotate(l.angle);

                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.roundRect(-l.w/2 + 5, -l.h/2 + 6, l.w, l.h, 6);
                ctx.fill();

                ctx.fillStyle = '#422813';
                ctx.beginPath();
                ctx.roundRect(-l.w/2, -l.h/2, l.w, l.h, 6);
                ctx.fill();

                ctx.strokeStyle = '#211207';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(-l.w/2 + 10, -l.h/4); ctx.lineTo(l.w/2 - 10, -l.h/4);
                ctx.moveTo(-l.w/2 + 15, l.h/4); ctx.lineTo(l.w/2 - 15, l.h/4);
                ctx.stroke();

                ctx.fillStyle = '#b89062';
                ctx.beginPath();
                ctx.ellipse(l.w/2 - 2, 0, 4.5, l.h/2 - 1, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#3c6e27';
                ctx.beginPath();
                ctx.ellipse(-6, -l.h/3, l.w * 0.28, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 2.5) {
                    ctx.beginPath();
                    ctx.arc(fl.x + Math.cos(a) * 2.2, fl.y + Math.sin(a) * 2.2, 1.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#2b1a00';
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 1.3, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let r of rocks) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
                ctx.beginPath();
                ctx.arc(r.x + 5, r.y + 7, r.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#5f6664';
                ctx.beginPath();
                ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#7a827f';
                ctx.beginPath();
                ctx.arc(r.x - r.radius * 0.25, r.y - r.radius * 0.25, r.radius * 0.65, 0, Math.PI * 2);
                ctx.fill();

                if (r.hasMoss) {
                    ctx.fillStyle = '#356322';
                    ctx.beginPath();
                    ctx.arc(r.x + r.radius * 0.2, r.y - r.radius * 0.3, r.radius * 0.4, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.arc(b.x + 6, b.y + 6, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#173613';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#234f1e';
                ctx.beginPath();
                ctx.arc(b.x - 5, b.y - 5, b.radius * 0.72, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let t of trees) {
                ctx.fillStyle = 'rgba(6, 14, 4, 0.35)';
                ctx.beginPath();
                ctx.arc(t.x + 22, t.y + 25, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2b1b0c';
                ctx.beginPath();
                ctx.arc(t.x, t.y, 11, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(16, 43, 13, 0.85)';
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(28, 69, 23, 0.75)';
                ctx.beginPath();
                ctx.arc(t.x - 12, t.y - 12, t.radius * 0.68, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function loop() {
            let needsUIUpdate = false;

            for (let s = 0; s < gameSpeed; s++) {
                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }

                // Actualizar telarañas proyectiles
                for (let i = webs.length - 1; i >= 0; i--) {
                    let w = webs[i];
                    w.x += Math.cos(w.angle) * w.speed;
                    w.y += Math.sin(w.angle) * w.speed;
                    w.life--;

                    // Colisión con hormigas o termitas
                    let hit = false;
                    for (let ant of ants) {
                        if (Math.hypot(ant.x - w.x, ant.y - w.y) < 12) {
                            ant.slowTimer = 180; // 3 segundos ralentizada
                            hit = true;
                            break;
                        }
                    }
                    if (!hit) {
                        for (let t of termites) {
                            if (Math.hypot(t.x - w.x, t.y - w.y) < 12) {
                                t.slowTimer = 180;
                                hit = true;
                                break;
                            }
                        }
                    }

                    if (hit || w.life <= 0 || checkObstacleCollision(w.x, w.y, 2)) {
                        webs.splice(i, 1);
                    }
                }

                for (let ant of ants) ant.update();
                for (let t of termites) t.update();
                for (let en of enemies) en.update();

                for (let i = ants.length - 1; i >= 0; i--) {
                    if (ants[i].hp <= 0) {
                        foods.push({ x: ants[i].x, y: ants[i].y, amount: 2 });
                        ants.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = termites.length - 1; i >= 0; i--) {
                    if (termites[i].hp <= 0) {
                        foods.push({ x: termites[i].x, y: termites[i].y, amount: 3 });
                        termites.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        let drop = enemies[i].type === 'mantis' ? 25 : 12;
                        spawnFoodCluster(enemies[i].x, enemies[i].y, Math.ceil(drop / 3));
                        enemies.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }
            }

            if (needsUIUpdate) updateUI();

            drawEnvironmentBase();

            for (let p of pheromones) {
                ctx.fillStyle = `rgba(220, 245, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let f of foods) {
                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y, 2.2 + f.amount * 0.55, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#ffccd5';
                ctx.beginPath();
                ctx.arc(f.x - 1, f.y - 1, 1, 0, Math.PI * 2);
                ctx.fill();
            }

            // Dibujar Telarañas voladoras
            for (let w of webs) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 4, 0, Math.PI * 2);
                ctx.stroke();
            }

            for (let n of antNests) {
                ctx.fillStyle = '#593825';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 7, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#120a06';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius - 5, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let n of termiteNests) {
                ctx.fillStyle = '#7d481e';
                ctx.beginPath();
                ctx.arc(n.x, n.y, n.radius + 8, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#9e6c50';
                ctx.beginPath();
                ctx.arc(n.x - 4, n.y - 4, n.radius * 0.65, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4a2e1a';
                ctx.beginPath();
                ctx.arc(n.x + 3, n.y + 3, 5, 0, Math.PI * 2);
                ctx.arc(n.x - 6, n.y + 4, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let ant of ants) ant.draw();
            for (let t of termites) t.draw();
            for (let en of enemies) en.draw();

            drawCanopyLayer();

            const validPlacement = canPlaceAt(mousePos.x, mousePos.y, currentTool);
            const previewRadius = (currentTool === 'nest' || currentTool === 'termite_nest') ? 24 : (currentTool === 'mantis') ? 20 : (currentTool === 'spider') ? 14 : 16;

            ctx.strokeStyle = validPlacement ? 'rgba(167, 201, 87, 0.9)' : 'rgba(230, 57, 70, 0.95)';
            ctx.fillStyle = validPlacement ? 'rgba(167, 201, 87, 0.15)' : 'rgba(230, 57, 70, 0.25)';
            ctx.setLineDash([5, 4]);
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mousePos.x, mousePos.y, previewRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>
</html>

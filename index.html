<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ants Colony: Wild Forest Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0b1109;
            color: #f4f1de;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
        }
        header {
            text-align: center;
            margin-bottom: 4px;
        }
        h1 { 
            font-size: 1.35rem; 
            color: #b5e48c; 
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }
        #status-msg {
            font-size: 0.8rem;
            color: #fefae0;
            background: linear-gradient(90deg, #2d6a4f, #40916c);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 3px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        
        .hud {
            display: flex;
            gap: 14px;
            background: rgba(20, 30, 18, 0.92);
            padding: 7px 16px;
            border-radius: 10px;
            border: 1px solid #52796f;
            margin-bottom: 6px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        .stat { font-weight: bold; font-size: 0.85rem; }
        .stat span { color: #b5e48c; }
        .stat-enemy span { color: #ff758f; }
        
        .toolbar {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            background: linear-gradient(180deg, #52b788, #2d6a4f);
            color: white;
            border: 1px solid #74c69d;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.76rem;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.1s, filter 0.2s;
        }
        button:hover { filter: brightness(1.15); }
        button:active { transform: scale(0.95); }
        button.active {
            background: linear-gradient(180deg, #e63946, #9b2226);
            border-color: #ffb3c1;
            box-shadow: 0 0 10px rgba(230, 57, 70, 0.7);
        }
        .btn-termite { background: linear-gradient(180deg, #dda15e, #bc6c25); border-color: #faedcd; }
        .btn-beetle { background: linear-gradient(180deg, #606c38, #283618); border-color: #a3b18a; }
        .btn-predator { background: linear-gradient(180deg, #9d0208, #6a040f); border-color: #ffccd5; }
        .btn-danger { background: linear-gradient(180deg, #800f2f, #590d22); border-color: #ff758f; }

        canvas {
            background-color: #345822;
            border: 3px solid #1b2e11;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 14px 40px rgba(0,0,0,0.95);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌲 Ants Colony: Wild Forest</h1>
        <div id="status-msg">🏠 Colocar Hormiguero (La colonia crece automáticamente cada 10 🍓 recolectadas)</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">100</span></div>
        <div class="stat">🐜 Hormigas: <span id="ant-count">0</span></div>
        <div class="stat">🏗️ Termitas: <span id="termite-count">0</span></div>
        <div class="stat stat-enemy">☠️ Enemigos: <span id="enemy-count">0</span></div>
        <div class="stat">🏰 Nidos: <span id="nest-count">0</span></div>
        <div class="stat">🥚 Cría: <span id="spawn-progress">0/10 🍓</span></div>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Reiniciar Bosque</button>
    </div>

    <div class="toolbar">
        <button id="tool-nest" class="active" onclick="setTool('nest')">🏠 Nido Hormigas</button>
        <button id="tool-termite_nest" class="btn-termite" onclick="setTool('termite_nest')">🏰 Nido Termitas</button>
        <button id="tool-beetle" class="btn-beetle" onclick="setTool('beetle')">🪲 Escarabajo Pelotero</button>
        <button id="tool-food" onclick="setTool('food')">🍓 Soltar Comida</button>
        <button id="tool-spider" class="btn-predator" onclick="setTool('spider')">🕷️ Araña Teje-redes</button>
        <button id="tool-mantis" class="btn-predator" onclick="setTool('mantis')">🦗 Mantis Alfa</button>
    </div>

    <!-- Mapa Masivo 2200x1300 con perspectiva inclinada 2.5D -->
    <canvas id="gameCanvas" width="2200" height="1300"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const foodEl = document.getElementById('food-count');
        const antEl = document.getElementById('ant-count');
        const termiteEl = document.getElementById('termite-count');
        const enemyEl = document.getElementById('enemy-count');
        const nestEl = document.getElementById('nest-count');
        const progressEl = document.getElementById('spawn-progress');
        const statusEl = document.getElementById('status-msg');
        const btnSpeed = document.getElementById('btn-speed');

        // Factor de perspectiva inclinada 2.5D (achata el eje Y para dar ángulo de visión)
        const TILT = 0.78;

        let currentTool = 'nest';
        let storedFood = 100;
        let foodSpawnCounter = 0;
        let antNests = [];
        let termiteNests = [];
        let ants = [];
        let termites = [];
        let beetles = [];
        let enemies = [];
        let webs = [];
        let foods = [];
        let pheromones = [];
        let particles = [];
        let gameSpeed = 1;
        let mousePos = { x: -100, y: -100 };

        let grassBlades = [];
        let dirtPatches = [];
        let pebbles = [];
        let mushrooms = [];
        let ferns = [];
        let logs = [];
        let rocks = [];
        let bushes = [];
        let trees = [];
        let flowers = [];

        const toolDescriptions = {
            nest: "🏠 Colocar Hormiguero (Crecimiento automático al recolectar comida)",
            termite_nest: "🏰 Colocar Termitero (Montículo arcilloso 3D)",
            beetle: "🪲 Invocar Escarabajo Pelotero (Tanque pacífico que recolecta bolas de comida; los mobs lo atacan)",
            food: "🍓 Soltar Comida (Bayas y néctar del bosque)",
            spider: "🕷️ Invocar Araña (Lanza telarañas que inmovilizan presas)",
            mantis: "🦗 Invocar Mantis Alfa (Depredador letal de gran tamaño)"
        };

        function setTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            if(document.getElementById(`tool-${tool}`)) {
                document.getElementById(`tool-${tool}`).classList.add('active');
            }
            statusEl.textContent = toolDescriptions[tool];
            statusEl.style.background = "linear-gradient(90deg, #2d6a4f, #40916c)";
        }

        function spawnHitParticles(x, y, color = '#fff', count = 5) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 4,
                    vy: (Math.random() - 0.5) * 4 - 1,
                    life: 15 + Math.random() * 10,
                    maxLife: 25,
                    color: color,
                    size: 1.5 + Math.random() * 2
                });
            }
        }

        function isCollidingWithLog(x, y, margin) {
            for (let l of logs) {
                const dx = x - l.x;
                const dy = (y - l.y) / TILT;
                const cos = Math.cos(-l.angle);
                const sin = Math.sin(-l.angle);
                const localX = dx * cos - dy * sin;
                const localY = dx * sin + dy * cos;
                if (Math.abs(localX) < l.w / 2 + margin && Math.abs(localY) < l.h / 2 + margin) return true;
            }
            return false;
        }

        function canPlaceAt(x, y, tool) {
            if (x < 45 || x > canvas.width - 45 || y < 45 || y > canvas.height - 45) return false;
            const reqRadius = (tool === 'nest' || tool === 'termite_nest') ? 28 : (tool === 'mantis') ? 22 : (tool === 'spider' || tool === 'beetle') ? 16 : 12;

            for (let r of rocks) {
                if (Math.hypot(x - r.x, (y - r.y) / TILT) < r.radius + reqRadius) return false;
            }
            if (isCollidingWithLog(x, y, reqRadius)) return false;
            for (let n of antNests) {
                if (Math.hypot(x - n.x, (y - n.y) / TILT) < n.radius + reqRadius + 8) return false;
            }
            for (let n of termiteNests) {
                if (Math.hypot(x - n.x, (y - n.y) / TILT) < n.radius + reqRadius + 8) return false;
            }
            if (tool !== 'food') {
                for (let en of enemies) {
                    if (Math.hypot(x - en.x, (y - en.y) / TILT) < en.radius + reqRadius + 4) return false;
                }
            }
            return true;
        }

        function checkObstacleCollision(x, y, radius) {
            for (let rock of rocks) {
                if (Math.hypot(x - rock.x, (y - rock.y) / TILT) < rock.radius + radius) return true;
            }
            if (isCollidingWithLog(x, y, radius)) return true;
            return false;
        }

        // Movimiento suave con evasión inteligente de obstáculos (Steering)
        function moveEntitySmooth(entity, speed, radius) {
            let nextX = entity.x + Math.cos(entity.angle) * speed;
            let nextY = entity.y + Math.sin(entity.angle) * speed * TILT;

            if (checkObstacleCollision(nextX, nextY, radius)) {
                // Probar ángulos alternativos suavemente en lugar de rebotar brusco
                const offsets = [0.4, -0.4, 0.85, -0.85, 1.4, -1.4, Math.PI];
                for (let off of offsets) {
                    let testAngle = entity.angle + off;
                    let tx = entity.x + Math.cos(testAngle) * speed;
                    let ty = entity.y + Math.sin(testAngle) * speed * TILT;
                    if (!checkObstacleCollision(tx, ty, radius)) {
                        entity.angle = testAngle;
                        nextX = tx;
                        nextY = ty;
                        break;
                    }
                }
            }

            entity.x = nextX;
            entity.y = nextY;

            // Rebote suave en los bordes del bosque
            const margin = 22;
            if (entity.x < margin) { entity.x = margin; entity.angle = Math.PI - entity.angle; }
            if (entity.x > canvas.width - margin) { entity.x = canvas.width - margin; entity.angle = Math.PI - entity.angle; }
            if (entity.y < margin) { entity.y = margin; entity.angle = -entity.angle; }
            if (entity.y > canvas.height - margin) { entity.y = canvas.height - margin; entity.angle = -entity.angle; }
        }

        class Ant {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2.25;
                this.hp = 26;
                this.maxHp = 26;
                this.damage = 0.75;
                this.hasFood = false;
                this.pheromoneTimer = 0;
                this.slowTimer = 0;
                this.walkCycle = Math.random() * Math.PI * 2;
                this.wanderOffset = (Math.random() - 0.5) * 0.2;
            }

            update() {
                let currentSpeed = this.slowTimer > 0 ? this.speed * 0.35 : this.speed;
                if (this.slowTimer > 0) this.slowTimer--;
                this.walkCycle += currentSpeed * 0.28;

                let target = null;
                let minDist = 105;

                // Las hormigas atacan termitas, depredadores y también escarabajos si no llevan comida
                if (!this.hasFood) {
                    for (let t of termites) {
                        let d = Math.hypot(t.x - this.x, (t.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = t; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, (en.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                    for (let b of beetles) {
                        let d = Math.hypot(b.x - this.x, (b.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = b; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2((target.y - this.y) / TILT, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.22);
                    if (minDist < (target.radius || 12) + 7) {
                        target.hp -= this.damage;
                        target.x += Math.cos(targetAngle) * 2.5;
                        target.y += Math.sin(targetAngle) * 2.5 * TILT;
                        if (Math.random() < 0.2) spawnHitParticles(target.x, target.y, '#ffccd5', 2);
                    }
                } else {
                    // Movimiento orgánico fluido (wander suavizado)
                    this.wanderOffset += (Math.random() - 0.5) * 0.14;
                    this.wanderOffset = Math.max(-0.25, Math.min(0.25, this.wanderOffset));
                    this.angle += this.wanderOffset;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = (this.nest.y - this.y) / TILT;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        this.pheromoneTimer++;
                        if (this.pheromoneTimer % 6 === 0) {
                            pheromones.push({ x: this.x, y: this.y, life: 400 });
                        }

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 2;
                            foodSpawnCounter += 2;
                            checkAutoSpawn();
                            this.hp = Math.min(this.maxHp, this.hp + 6);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        let foundTarget = false;
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, (f.y - this.y) / TILT);
                            
                            if (dist < 95) {
                                let targetAngle = Math.atan2((f.y - this.y) / TILT, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.25);
                                foundTarget = true;

                                if (dist < 9) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }

                        if (!foundTarget && pheromones.length > 0) {
                            let bestPheromone = null;
                            let maxLife = 0;

                            for (let p of pheromones) {
                                let dist = Math.hypot(p.x - this.x, (p.y - this.y) / TILT);
                                if (dist > 12 && dist < 80) {
                                    let angleToP = Math.atan2((p.y - this.y) / TILT, p.x - this.x);
                                    let diff = Math.abs(this.normalizeAngle(angleToP - this.angle));
                                    if (diff < 1.15 && p.life > maxLife) {
                                        maxLife = p.life;
                                        bestPheromone = p;
                                    }
                                }
                            }

                            if (bestPheromone) {
                                let targetAngle = Math.atan2((bestPheromone.y - this.y) / TILT, bestPheromone.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.14);
                            }
                        }
                    }
                }

                moveEntitySmooth(this, currentSpeed, 4);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Sombra proyectada en perspectiva 2.5D
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(2, 4, 6, 3, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(1, TILT);
                ctx.rotate(this.angle);

                // Patas articuladas animadas
                ctx.strokeStyle = '#1f0c06';
                ctx.lineWidth = 1.3;
                let legSwing = Math.sin(this.walkCycle) * 3.5;
                ctx.beginPath();
                ctx.moveTo(-2, -3); ctx.lineTo(-5 + legSwing, -11);
                ctx.moveTo(0, -3); ctx.lineTo(1 - legSwing, -12);
                ctx.moveTo(2, -3); ctx.lineTo(6 + legSwing, -11);
                ctx.moveTo(-2, 3); ctx.lineTo(-5 - legSwing, 11);
                ctx.moveTo(0, 3); ctx.lineTo(1 + legSwing, 12);
                ctx.moveTo(2, 3); ctx.lineTo(6 - legSwing, 11);
                ctx.stroke();

                // Cuerpo con volumen y brillo estilo Wild Forest
                ctx.fillStyle = '#4a1c0e';
                ctx.beginPath();
                ctx.ellipse(-5, 0, 4.2, 2.7, 0, 0, Math.PI * 2);
                ctx.ellipse(0, 0, 2.6, 1.9, 0, 0, Math.PI * 2);
                ctx.ellipse(4.2, 0, 2.6, 2.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Reflejo dorsal
                ctx.fillStyle = '#8c3b20';
                ctx.beginPath();
                ctx.ellipse(-5, -0.7, 2.5, 1.1, 0, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#ff2a55';
                    ctx.beginPath();
                    ctx.arc(8, 0, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#ffccd5';
                    ctx.beginPath();
                    ctx.arc(7, -1, 1.2, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.slowTimer > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Termite {
            constructor(x, y, nestRef) {
                this.x = x;
                this.y = y;
                this.nest = nestRef;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2.0;
                this.hp = 30;
                this.maxHp = 30;
                this.damage = 0.8;
                this.hasFood = false;
                this.slowTimer = 0;
                this.walkCycle = Math.random() * Math.PI * 2;
                this.wanderOffset = (Math.random() - 0.5) * 0.2;
            }

            update() {
                let currentSpeed = this.slowTimer > 0 ? this.speed * 0.35 : this.speed;
                if (this.slowTimer > 0) this.slowTimer--;
                this.walkCycle += currentSpeed * 0.26;

                let target = null;
                let minDist = 100;

                if (!this.hasFood) {
                    for (let ant of ants) {
                        let d = Math.hypot(ant.x - this.x, (ant.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = ant; }
                    }
                    for (let en of enemies) {
                        let d = Math.hypot(en.x - this.x, (en.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = en; }
                    }
                    for (let b of beetles) {
                        let d = Math.hypot(b.x - this.x, (b.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = b; }
                    }
                }

                if (target) {
                    const targetAngle = Math.atan2((target.y - this.y) / TILT, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.22);
                    if (minDist < (target.radius || 12) + 7) {
                        target.hp -= this.damage;
                        target.x += Math.cos(targetAngle) * 2.5;
                        target.y += Math.sin(targetAngle) * 2.5 * TILT;
                        if (Math.random() < 0.2) spawnHitParticles(target.x, target.y, '#ffe8d6', 2);
                    }
                } else {
                    this.wanderOffset += (Math.random() - 0.5) * 0.14;
                    this.wanderOffset = Math.max(-0.25, Math.min(0.25, this.wanderOffset));
                    this.angle += this.wanderOffset;

                    if (this.hasFood) {
                        const dx = this.nest.x - this.x;
                        const dy = (this.nest.y - this.y) / TILT;
                        const dist = Math.hypot(dx, dy);
                        
                        const targetAngle = Math.atan2(dy, dx);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.18);

                        if (dist < this.nest.radius) {
                            this.hasFood = false;
                            storedFood += 1;
                            foodSpawnCounter += 1;
                            checkAutoSpawn();
                            this.hp = Math.min(this.maxHp, this.hp + 5);
                            this.angle += Math.PI;
                            updateUI();
                        }
                    } else {
                        for (let i = foods.length - 1; i >= 0; i--) {
                            let f = foods[i];
                            let dist = Math.hypot(f.x - this.x, (f.y - this.y) / TILT);
                            
                            if (dist < 90) {
                                let targetAngle = Math.atan2((f.y - this.y) / TILT, f.x - this.x);
                                this.angle = this.lerpAngle(this.angle, targetAngle, 0.22);

                                if (dist < 9) {
                                    this.hasFood = true;
                                    f.amount--;
                                    if (f.amount <= 0) foods.splice(i, 1);
                                    break;
                                }
                            }
                        }
                    }
                }

                moveEntitySmooth(this, currentSpeed, 4);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(2, 4, 6.5, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(1, TILT);
                ctx.rotate(this.angle);

                // Patas
                ctx.strokeStyle = '#7f4f24';
                ctx.lineWidth = 1.2;
                let legSwing = Math.sin(this.walkCycle) * 3;
                ctx.beginPath();
                ctx.moveTo(-2, -3); ctx.lineTo(-4 + legSwing, -10);
                ctx.moveTo(1, -3); ctx.lineTo(3 - legSwing, -10);
                ctx.moveTo(-2, 3); ctx.lineTo(-4 - legSwing, 10);
                ctx.moveTo(1, 3); ctx.lineTo(3 + legSwing, 10);
                ctx.stroke();

                // Abdomen pálido con segmentos
                ctx.fillStyle = '#f8edeb';
                ctx.beginPath();
                ctx.ellipse(-4, 0, 5.2, 3.2, 0, 0, Math.PI * 2);
                ctx.fill();

                // Cabeza cobriza blindada
                ctx.fillStyle = '#bc6c25';
                ctx.beginPath();
                ctx.arc(3.8, 0, 3.4, 0, Math.PI * 2);
                ctx.fill();

                if (this.hasFood) {
                    ctx.fillStyle = '#ff2a55';
                    ctx.beginPath();
                    ctx.arc(8, 0, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (this.slowTimer > 0) {
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.lineWidth = 1.4;
                    ctx.beginPath();
                    ctx.arc(0, 0, 9.5, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Beetle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 15;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 1.4;
                this.hp = 240; // Gran resistencia
                this.maxHp = 240;
                this.hasBall = false;
                this.ballSize = 14;
                this.ballSpin = 0;
                this.walkCycle = Math.random() * Math.PI * 2;
            }

            update() {
                this.walkCycle += this.speed * 0.22;
                if (this.hasBall) this.ballSpin += 0.1;

                // Detectar amenazas cercanas (depredadores o enjambres atacando)
                let threat = null;
                let minThreatDist = 140;
                for (let en of enemies) {
                    let d = Math.hypot(en.x - this.x, (en.y - this.y) / TILT);
                    if (d < minThreatDist) { minThreatDist = d; threat = en; }
                }
                if (!threat) {
                    for (let a of ants) {
                        let d = Math.hypot(a.x - this.x, (a.y - this.y) / TILT);
                        if (d < 65) { minThreatDist = d; threat = a; break; }
                    }
                }

                if (threat) {
                    const fleeAngle = Math.atan2((this.y - threat.y) / TILT, this.x - threat.x);
                    this.angle = this.lerpAngle(this.angle, fleeAngle, 0.18);
                    // Si suelta la bola al huir, deja comida en el suelo
                    if (this.hasBall && minThreatDist < 55) {
                        this.hasBall = false;
                        spawnFoodCluster(this.x, this.y, 3);
                    }
                } else if (this.hasBall) {
                    this.angle += (Math.random() - 0.5) * 0.08;
                } else {
                    let closestFood = null;
                    let minD = 280;
                    for (let f of foods) {
                        let d = Math.hypot(f.x - this.x, (f.y - this.y) / TILT);
                        if (d < minD) { minD = d; closestFood = f; }
                    }

                    if (closestFood) {
                        let targetAngle = Math.atan2((closestFood.y - this.y) / TILT, closestFood.x - this.x);
                        this.angle = this.lerpAngle(this.angle, targetAngle, 0.15);

                        if (minD < 14) {
                            let idx = foods.indexOf(closestFood);
                            if (idx > -1) foods.splice(idx, 1);
                            this.hasBall = true;
                        }
                    } else {
                        this.angle += (Math.random() - 0.5) * 0.2;
                    }
                }

                moveEntitySmooth(this, this.speed, 14);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barra de salud si ha recibido daño
                if (this.hp < this.maxHp) {
                    ctx.fillStyle = 'rgba(0,0,0,0.65)';
                    ctx.fillRect(-16, -24, 32, 4);
                    ctx.fillStyle = '#80ed99';
                    ctx.fillRect(-16, -24, 32 * Math.max(0, this.hp / this.maxHp), 4);
                }

                // Sombra proyectada 2.5D
                ctx.fillStyle = 'rgba(0,0,0,0.42)';
                ctx.beginPath();
                ctx.ellipse(3, 6, 16, 9, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(1, TILT);
                ctx.rotate(this.angle);

                // Patas robustas
                ctx.strokeStyle = '#1b2618';
                ctx.lineWidth = 2;
                let swing = Math.sin(this.walkCycle) * 3;
                ctx.beginPath();
                ctx.moveTo(-4, -8); ctx.lineTo(-8 + swing, -16);
                ctx.moveTo(2, -8); ctx.lineTo(4 - swing, -17);
                ctx.moveTo(7, -6); ctx.lineTo(11 + swing, -14);
                ctx.moveTo(-4, 8); ctx.lineTo(-8 - swing, 16);
                ctx.moveTo(2, 8); ctx.lineTo(4 + swing, 17);
                ctx.moveTo(7, 6); ctx.lineTo(11 - swing, 14);
                ctx.stroke();

                // Caparazón iridiscente verde-bronce estilo Wild Forest
                ctx.fillStyle = '#283618';
                ctx.beginPath();
                ctx.ellipse(0, 0, 15, 11, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4f772d';
                ctx.beginPath();
                ctx.ellipse(-2, -1, 12, 8, 0, 0, Math.PI * 2);
                ctx.fill();

                // Brillo metálico en el caparazón
                ctx.fillStyle = 'rgba(181, 228, 140, 0.35)';
                ctx.beginPath();
                ctx.ellipse(-2, -3.5, 8, 3, -0.2, 0, Math.PI * 2);
                ctx.fill();

                // Cuerno frontal pequeño
                ctx.fillStyle = '#132a13';
                ctx.beginPath();
                ctx.moveTo(13, -3); ctx.lineTo(19, 0); ctx.lineTo(13, 3);
                ctx.fill();

                // Bola de comida/estiércol rodando detrás
                if (this.hasBall) {
                    ctx.save();
                    ctx.translate(-21, 0);
                    ctx.rotate(this.ballSpin);
                    ctx.fillStyle = '#583101';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.ballSize, 0, Math.PI * 2);
                    ctx.fill();

                    // Textura orgánica de la bola
                    ctx.fillStyle = '#3d1e00';
                    ctx.beginPath();
                    ctx.arc(-4, -3, 3.5, 0, Math.PI * 2);
                    ctx.arc(5, 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#e63946'; // Trozo de baya incrustado
                    ctx.beginPath();
                    ctx.arc(2, -5, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        class Enemy {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type;
                this.angle = Math.random() * Math.PI * 2;
                this.attackCooldown = 0;
                this.walkCycle = Math.random() * Math.PI * 2;
                
                if (type === 'mantis') {
                    this.speed = 2.3;
                    this.radius = 22;
                    this.hp = 190;
                    this.maxHp = 190;
                    this.damage = 4.5;
                    this.sight = 300;
                } else {
                    this.speed = 1.75;
                    this.radius = 16;
                    this.hp = 100;
                    this.maxHp = 100;
                    this.damage = 2.4;
                    this.sight = 260;
                }
            }

            update() {
                if (this.attackCooldown > 0) this.attackCooldown--;
                this.walkCycle += this.speed * 0.25;

                let target = null;
                let minDist = this.sight;

                // Ataca a otros enemigos distintos, hormigas, termitas Y al escarabajo pelotero
                for (let other of enemies) {
                    if (other !== this && other.type !== this.type) {
                        let d = Math.hypot(other.x - this.x, (other.y - this.y) / TILT);
                        if (d < minDist) { minDist = d; target = other; }
                    }
                }
                for (let ant of ants) {
                    let d = Math.hypot(ant.x - this.x, (ant.y - this.y) / TILT);
                    if (d < minDist) { minDist = d; target = ant; }
                }
                for (let t of termites) {
                    let d = Math.hypot(t.x - this.x, (t.y - this.y) / TILT);
                    if (d < minDist) { minDist = d; target = t; }
                }
                for (let b of beetles) {
                    let d = Math.hypot(b.x - this.x, (b.y - this.y) / TILT);
                    if (d < minDist) { minDist = d; target = b; }
                }

                if (target) {
                    let targetAngle = Math.atan2((target.y - this.y) / TILT, target.x - this.x);
                    this.angle = this.lerpAngle(this.angle, targetAngle, 0.16);

                    if (this.type === 'spider' && minDist < 230 && minDist > 50 && this.attackCooldown === 0) {
                        webs.push({ x: this.x, y: this.y, angle: targetAngle, speed: 5.2, life: 75 });
                        this.attackCooldown = 75;
                    }

                    if (minDist < this.radius + (target.radius || 5) + 4) {
                        target.hp -= this.damage;
                        // Retroceso (knockback) potente
                        target.x += Math.cos(targetAngle) * 4.5;
                        target.y += Math.sin(targetAngle) * 4.5 * TILT;
                        if (Math.random() < 0.35) spawnHitParticles(target.x, target.y, '#ffbe0b', 3);

                        if (target.hp <= 0) this.hp = Math.min(this.maxHp, this.hp + 25);
                    }
                } else {
                    this.angle += (Math.random() - 0.5) * 0.25;
                }

                moveEntitySmooth(this, this.speed, this.radius * 0.7);
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);

                // Barra de salud flotante
                const barWidth = this.radius * 2.2;
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(-barWidth / 2, -this.radius - 16, barWidth, 4.5);
                ctx.fillStyle = this.type === 'mantis' ? '#ffbe0b' : '#ff4d6d';
                ctx.fillRect(-barWidth / 2, -this.radius - 16, barWidth * Math.max(0, this.hp / this.maxHp), 4.5);

                // Sombra proyectada 2.5D
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.ellipse(4, 8, this.radius * 1.1, this.radius * 0.6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.scale(1, TILT);
                ctx.rotate(this.angle);

                if (this.type === 'mantis') {
                    // Patas traseras articuladas
                    ctx.strokeStyle = '#1b4332';
                    ctx.lineWidth = 2.6;
                    let swing = Math.sin(this.walkCycle) * 4;
                    ctx.beginPath();
                    ctx.moveTo(-6, -5); ctx.lineTo(-16 + swing, -20);
                    ctx.moveTo(-6, 5); ctx.lineTo(-16 - swing, 20);
                    ctx.moveTo(0, -5); ctx.lineTo(-3 - swing, -18);
                    ctx.moveTo(0, 5); ctx.lineTo(-3 + swing, 18);
                    ctx.stroke();

                    // Guadañas delanteras afiladas
                    ctx.strokeStyle = '#40916c';
                    ctx.lineWidth = 4.2;
                    ctx.beginPath();
                    ctx.moveTo(10, -4); ctx.lineTo(28, -17); ctx.lineTo(21, -3);
                    ctx.moveTo(10, 4); ctx.lineTo(28, 17); ctx.lineTo(21, 3);
                    ctx.stroke();

                    // Cuerpo estilizado en capas
                    ctx.fillStyle = '#1b4332';
                    ctx.beginPath();
                    ctx.ellipse(-8, 0, 17, 8, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#2d6a4f';
                    ctx.beginPath();
                    ctx.ellipse(9, 0, 12, 6, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Cabeza triangular y ojos dorados
                    ctx.fillStyle = '#74c69d';
                    ctx.beginPath();
                    ctx.arc(21, 0, 6.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(23, -4.5, 2.6, 0, Math.PI * 2);
                    ctx.arc(23, 4.5, 2.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Araña teje-redes articulada
                    ctx.strokeStyle = '#0f0f0f';
                    ctx.lineWidth = 2.4;
                    let swing = Math.sin(this.walkCycle) * 3.5;
                    for (let i = -1; i <= 1; i += 2) {
                        ctx.beginPath();
                        ctx.moveTo(-3, 0); ctx.lineTo(-16 + swing * i, i * 21);
                        ctx.moveTo(-1, 0); ctx.lineTo(-7 - swing * i, i * 23);
                        ctx.moveTo(2, 0); ctx.lineTo(9 + swing * i, i * 22);
                        ctx.moveTo(4, 0); ctx.lineTo(17 - swing * i, i * 18);
                        ctx.stroke();
                    }

                    ctx.fillStyle = '#161616';
                    ctx.beginPath();
                    ctx.arc(-7, 0, 11.5, 0, Math.PI * 2);
                    ctx.arc(7, 0, 7.8, 0, Math.PI * 2);
                    ctx.fill();

                    // Marca roja de peligro en el abdomen
                    ctx.fillStyle = '#d90429';
                    ctx.beginPath();
                    ctx.moveTo(-8, -4); ctx.lineTo(-3, 0); ctx.lineTo(-8, 4); ctx.lineTo(-13, 0);
                    ctx.fill();

                    // Ojos brillantes
                    ctx.fillStyle = '#ff0054';
                    ctx.fillRect(13, -3.5, 2.2, 2.2);
                    ctx.fillRect(13, 1.3, 2.2, 2.2);
                }

                ctx.restore();
            }

            normalizeAngle(a) {
                while (a > Math.PI) a -= Math.PI * 2;
                while (a < -Math.PI) a += Math.PI * 2;
                return a;
            }
            lerpAngle(a, b, t) {
                const diff = this.normalizeAngle(b - a);
                return a + diff * t;
            }
        }

        function checkAutoSpawn() {
            if (foodSpawnCounter >= 10) {
                foodSpawnCounter -= 10;
                let spawnAnts = antNests.length > 0 && (termiteNests.length === 0 || Math.random() > 0.5);
                if (spawnAnts && antNests.length > 0) {
                    let nest = antNests[Math.floor(Math.random() * antNests.length)];
                    ants.push(new Ant(nest.x, nest.y, nest));
                } else if (termiteNests.length > 0) {
                    let nest = termiteNests[Math.floor(Math.random() * termiteNests.length)];
                    termites.push(new Termite(nest.x, nest.y, nest));
                }
            }
        }

        function generateEnvironment() {
            grassBlades = [];
            dirtPatches = [];
            pebbles = [];
            mushrooms = [];
            ferns = [];
            logs = [];
            rocks = [];
            bushes = [];
            trees = [];
            flowers = [];
            foods = [];
            beetles = [];

            for (let i = 0; i < 45; i++) {
                dirtPatches.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    rx: 65 + Math.random() * 85,
                    ry: (45 + Math.random() * 65) * TILT,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 320; i++) {
                pebbles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 1.5 + Math.random() * 3.5,
                    color: Math.random() > 0.5 ? '#58615d' : '#7f8a86'
                });
            }

            for (let i = 0; i < 30; i++) {
                mushrooms.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    color: Math.random() > 0.5 ? '#e76f51' : '#f4a261',
                    size: 3.5 + Math.random() * 3
                });
            }

            const grassColors = ['#224215', '#346221', '#487d2e'];
            for (let i = 0; i < 4000; i++) {
                grassBlades.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    h: 6 + Math.random() * 9,
                    lean: (Math.random() - 0.5) * 6,
                    color: grassColors[Math.floor(Math.random() * grassColors.length)]
                });
            }

            for (let i = 0; i < 60; i++) {
                ferns.push({
                    x: 60 + Math.random() * (canvas.width - 120),
                    y: 60 + Math.random() * (canvas.height - 120),
                    size: 20 + Math.random() * 14,
                    angle: Math.random() * Math.PI * 2
                });
            }

            for (let i = 0; i < 14; i++) {
                logs.push({
                    x: 180 + Math.random() * (canvas.width - 360),
                    y: 180 + Math.random() * (canvas.height - 360),
                    w: 105 + Math.random() * 70,
                    h: 30 + Math.random() * 14,
                    angle: Math.random() * Math.PI
                });
            }

            for (let i = 0; i < 28; i++) {
                let rx = 120 + Math.random() * (canvas.width - 240);
                let ry = 120 + Math.random() * (canvas.height - 240);
                let radius = 26 + Math.random() * 28;
                if (!isCollidingWithLog(rx, ry, 55)) {
                    let points = [];
                    let numVerts = 7 + Math.floor(Math.random() * 5);
                    for (let v = 0; v < numVerts; v++) {
                        let a = (v / numVerts) * Math.PI * 2;
                        let dist = radius * (0.75 + Math.random() * 0.5);
                        points.push({ x: Math.cos(a) * dist, y: Math.sin(a) * dist * TILT });
                    }
                    rocks.push({ x: rx, y: ry, radius: radius, points: points, hasMoss: Math.random() > 0.3 });
                }
            }

            const flowerColors = ['#ffb703', '#fb8500', '#ffffff', '#e0a96d', '#9b5de5', '#00bbf9'];
            for (let i = 0; i < 150; i++) {
                flowers.push({
                    x: 50 + Math.random() * (canvas.width - 100),
                    y: 50 + Math.random() * (canvas.height - 100),
                    color: flowerColors[Math.floor(Math.random() * flowerColors.length)]
                });
            }

            for (let i = 0; i < 26; i++) {
                const bx = 90 + Math.random() * (canvas.width - 180);
                const by = 90 + Math.random() * (canvas.height - 180);
                let radius = 32 + Math.random() * 16;
                let lobes = [];
                let numLobes = 4 + Math.floor(Math.random() * 3);
                for (let l = 0; l < numLobes; l++) {
                    let la = (l / numLobes) * Math.PI * 2;
                    let dist = radius * 0.32 * Math.random();
                    lobes.push({ x: Math.cos(la) * dist, y: Math.sin(la) * dist * TILT, r: radius * (0.6 + Math.random() * 0.4) });
                }
                bushes.push({ x: bx, y: by, radius: radius, lobes: lobes });
                spawnFoodCluster(bx + (Math.random() - 0.5) * 65, by + (Math.random() - 0.5) * 65, 12);
            }

            for (let i = 0; i < 20; i++) {
                const tx = 140 + Math.random() * (canvas.width - 280);
                const ty = 140 + Math.random() * (canvas.height - 280);
                let radius = 68 + Math.random() * 30;
                let lobes = [];
                let numLobes = 5 + Math.floor(Math.random() * 3);
                for (let l = 0; l < numLobes; l++) {
                    let la = (l / numLobes) * Math.PI * 2;
                    let dist = radius * 0.36 * Math.random();
                    lobes.push({ x: Math.cos(la) * dist, y: Math.sin(la) * dist * TILT, r: radius * (0.65 + Math.random() * 0.35) });
                }
                trees.push({ x: tx, y: ty, radius: radius, lobes: lobes });
            }
        }

        function init() {
            antNests = [];
            termiteNests = [];
            ants = [];
            termites = [];
            beetles = [];
            enemies = [];
            webs = [];
            pheromones = [];
            particles = [];
            storedFood = 100;
            foodSpawnCounter = 0;
            generateEnvironment();
            updateUI();
            setTool('nest');
        }

        function placeNest(x, y, type) {
            let newNest = { x, y, radius: 26 };
            if (type === 'ant') {
                antNests.push(newNest);
                for (let i = 0; i < 8; i++) ants.push(new Ant(x, y, newNest));
            } else {
                termiteNests.push(newNest);
                for (let i = 0; i < 6; i++) termites.push(new Termite(x, y, newNest));
            }
            updateUI();
        }

        function spawnFoodCluster(x, y, count = 12) {
            for (let i = 0; i < count; i++) {
                const offsetX = (Math.random() - 0.5) * 60;
                const offsetY = (Math.random() - 0.5) * 60 * TILT;
                let fx = Math.max(30, Math.min(canvas.width - 30, x + offsetX));
                let fy = Math.max(30, Math.min(canvas.height - 30, y + offsetY));
                if (!checkObstacleCollision(fx, fy, 4)) {
                    foods.push({ x: fx, y: fy, amount: 5 });
                }
            }
        }

        function updateUI() {
            foodEl.textContent = storedFood;
            antEl.textContent = ants.length;
            termiteEl.textContent = termites.length;
            enemyEl.textContent = enemies.length;
            nestEl.textContent = antNests.length + termiteNests.length;
            progressEl.textContent = `${foodSpawnCounter}/10 🍓`;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (canvas.width / rect.width);
            mousePos.y = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const clickY = (e.clientY - rect.top) * (canvas.height / rect.height);

            if (!canPlaceAt(clickX, clickY, currentTool)) {
                statusEl.textContent = "⚠️ Espacio bloqueado por obstáculos o entidades";
                statusEl.style.background = "linear-gradient(90deg, #9b2226, #ae2012)";
                return;
            }

            statusEl.textContent = toolDescriptions[currentTool];
            statusEl.style.background = "linear-gradient(90deg, #2d6a4f, #40916c)";

            if (currentTool === 'nest') {
                placeNest(clickX, clickY, 'ant');
            } else if (currentTool === 'termite_nest') {
                placeNest(clickX, clickY, 'termite');
            } else if (currentTool === 'beetle') {
                beetles.push(new Beetle(clickX, clickY));
            } else if (currentTool === 'food') {
                spawnFoodCluster(clickX, clickY);
            } else if (currentTool === 'spider') {
                enemies.push(new Enemy(clickX, clickY, 'spider'));
            } else if (currentTool === 'mantis') {
                enemies.push(new Enemy(clickX, clickY, 'mantis'));
            }
            updateUI();
        });

        btnSpeed.addEventListener('click', () => {
            gameSpeed = gameSpeed === 1 ? 2 : gameSpeed === 2 ? 4 : 1;
            btnSpeed.textContent = `Velocidad: ${gameSpeed}x`;
        });

        document.getElementById('btn-clear').addEventListener('click', init);

        function drawEnvironmentBase() {
            // Suelo base rico estilo Wild Forest
            ctx.fillStyle = '#345822';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let d of dirtPatches) {
                ctx.save();
                ctx.translate(d.x, d.y);
                ctx.rotate(d.angle);
                ctx.fillStyle = 'rgba(67, 40, 24, 0.45)';
                ctx.beginPath();
                ctx.ellipse(0, 0, d.rx, d.ry, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            for (let p of pebbles) {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, p.r, p.r * TILT, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let m of mushrooms) {
                ctx.fillStyle = '#fefae0';
                ctx.fillRect(m.x - 1.2, m.y - 3, 2.4, m.size + 3);
                ctx.fillStyle = m.color;
                ctx.beginPath();
                ctx.ellipse(m.x, m.y - 3, m.size, m.size * 0.7, 0, Math.PI, Math.PI * 2);
                ctx.fill();
            }

            for (let g of grassBlades) {
                ctx.strokeStyle = g.color;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(g.x, g.y);
                ctx.lineTo(g.x + g.lean, g.y - g.h);
                ctx.stroke();
            }

            for (let fn of ferns) {
                ctx.save();
                ctx.translate(fn.x, fn.y);
                ctx.scale(1, TILT);
                ctx.rotate(fn.angle);
                ctx.strokeStyle = '#1b4332';
                ctx.lineWidth = 2.2;
                for (let i = 0; i < 6; i++) {
                    ctx.rotate(Math.PI / 3);
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(fn.size, 0);
                    ctx.stroke();
                }
                ctx.restore();
            }

            for (let l of logs) {
                ctx.save();
                ctx.translate(l.x, l.y);
                ctx.scale(1, TILT);
                ctx.rotate(l.angle);

                // Sombra proyectada
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.roundRect(-l.w/2 + 8, -l.h/2 + 10, l.w, l.h, 8);
                ctx.fill();

                // Tronco cilíndrico con corteza
                ctx.fillStyle = '#432818';
                ctx.beginPath();
                ctx.roundRect(-l.w/2, -l.h/2, l.w, l.h, 8);
                ctx.fill();

                // Cara cortada en perspectiva
                ctx.fillStyle = '#bb9457';
                ctx.beginPath();
                ctx.ellipse(l.w/2 - 2, 0, 6, l.h/2 - 1, 0, 0, Math.PI * 2);
                ctx.fill();

                // Musgo encima del tronco
                ctx.fillStyle = '#386641';
                ctx.beginPath();
                ctx.ellipse(-10, -l.h/3, l.w * 0.32, 6, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            for (let fl of flowers) {
                ctx.fillStyle = fl.color;
                for (let a = 0; a < Math.PI * 2; a += Math.PI / 2.5) {
                    ctx.beginPath();
                    ctx.ellipse(fl.x + Math.cos(a) * 2.8, fl.y + Math.sin(a) * 2.8 * TILT, 2, 1.5, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.fillStyle = '#3d1e00';
                ctx.beginPath();
                ctx.arc(fl.x, fl.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Rocas con volumen 2.5D (base oscura + cara iluminada)
            for (let r of rocks) {
                ctx.save();
                ctx.translate(r.x, r.y);

                // Sombra proyectada
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x + 8, r.points[0].y + 12);
                for (let pt of r.points) ctx.lineTo(pt.x + 8, pt.y + 12);
                ctx.closePath();
                ctx.fill();

                // Base lateral 3D de la roca
                ctx.fillStyle = '#3d4542';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x, r.points[0].y + 6);
                for (let pt of r.points) ctx.lineTo(pt.x, pt.y + 6);
                ctx.closePath();
                ctx.fill();

                // Cara superior de la roca
                ctx.fillStyle = '#6c757d';
                ctx.beginPath();
                ctx.moveTo(r.points[0].x, r.points[0].y - 3);
                for (let pt of r.points) ctx.lineTo(pt.x, pt.y - 3);
                ctx.closePath();
                ctx.fill();

                if (r.hasMoss) {
                    ctx.fillStyle = '#386641';
                    ctx.beginPath();
                    ctx.ellipse(r.radius * 0.15, -r.radius * 0.25 * TILT - 3, r.radius * 0.42, r.radius * 0.28, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function drawCanopyLayer() {
            for (let b of bushes) {
                ctx.save();
                ctx.translate(b.x, b.y);

                ctx.fillStyle = 'rgba(0,0,0,0.38)';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x + 8, lob.y + 12, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#1b4332';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x, lob.y, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#2d6a4f';
                for (let lob of b.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x - 3, lob.y - 5, lob.r * 0.72, lob.r * 0.72 * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Árboles en 2.5D con tronco vertical visible y copa elevada
            for (let t of trees) {
                ctx.save();
                ctx.translate(t.x, t.y);

                // Sombra en el suelo
                ctx.fillStyle = 'rgba(4, 12, 2, 0.42)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x + 28, lob.y + 34, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Tronco vertical visible desde ángulo inclinado
                ctx.fillStyle = '#3d1e00';
                ctx.fillRect(-10, -25, 20, 32);
                ctx.beginPath();
                ctx.ellipse(0, 7, 13, 7, 0, 0, Math.PI * 2);
                ctx.fill();

                // Copa elevada en Y (-25px)
                ctx.fillStyle = 'rgba(18, 53, 20, 0.9)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x, lob.y - 25, lob.r, lob.r * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = 'rgba(45, 106, 79, 0.8)';
                for (let lob of t.lobes) {
                    ctx.beginPath();
                    ctx.ellipse(lob.x - 8, lob.y - 32, lob.r * 0.7, lob.r * 0.7 * TILT, 0, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }
        }

        function loop() {
            let needsUIUpdate = false;

            for (let s = 0; s < gameSpeed; s++) {
                for (let i = pheromones.length - 1; i >= 0; i--) {
                    pheromones[i].life--;
                    if (pheromones[i].life <= 0) pheromones.splice(i, 1);
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    let pt = particles[i];
                    pt.x += pt.vx;
                    pt.y += pt.vy;
                    pt.life--;
                    if (pt.life <= 0) particles.splice(i, 1);
                }

                for (let i = webs.length - 1; i >= 0; i--) {
                    let w = webs[i];
                    w.x += Math.cos(w.angle) * w.speed;
                    w.y += Math.sin(w.angle) * w.speed * TILT;
                    w.life--;

                    let hit = false;
                    for (let ant of ants) {
                        if (Math.hypot(ant.x - w.x, (ant.y - w.y) / TILT) < 14) {
                            ant.slowTimer = 200;
                            hit = true;
                            break;
                        }
                    }
                    if (!hit) {
                        for (let t of termites) {
                            if (Math.hypot(t.x - w.x, (t.y - w.y) / TILT) < 14) {
                                t.slowTimer = 200;
                                hit = true;
                                break;
                            }
                        }
                    }

                    if (hit || w.life <= 0 || checkObstacleCollision(w.x, w.y, 2)) {
                        webs.splice(i, 1);
                    }
                }

                for (let ant of ants) ant.update();
                for (let t of termites) t.update();
                for (let b of beetles) b.update();
                for (let en of enemies) en.update();

                for (let i = ants.length - 1; i >= 0; i--) {
                    if (ants[i].hp <= 0) {
                        foods.push({ x: ants[i].x, y: ants[i].y, amount: 2 });
                        ants.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = termites.length - 1; i >= 0; i--) {
                    if (termites[i].hp <= 0) {
                        foods.push({ x: termites[i].x, y: termites[i].y, amount: 3 });
                        termites.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = beetles.length - 1; i >= 0; i--) {
                    if (beetles[i].hp <= 0) {
                        spawnFoodCluster(beetles[i].x, beetles[i].y, 6);
                        beetles.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }

                for (let i = enemies.length - 1; i >= 0; i--) {
                    if (enemies[i].hp <= 0) {
                        let drop = enemies[i].type === 'mantis' ? 30 : 15;
                        spawnFoodCluster(enemies[i].x, enemies[i].y, Math.ceil(drop / 3));
                        enemies.splice(i, 1);
                        needsUIUpdate = true;
                    }
                }
            }

            if (needsUIUpdate) updateUI();

            // 1. Dibujar el suelo y relieves 2.5D
            drawEnvironmentBase();

            // 2. Feromonas
            for (let p of pheromones) {
                ctx.fillStyle = `rgba(200, 240, 255, ${p.life / 950})`;
                ctx.beginPath();
                ctx.ellipse(p.x, p.y, 2.2, 1.6, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 3. Comida con volumen 3D
            for (let f of foods) {
                let r = 2.8 + f.amount * 0.55;
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath();
                ctx.ellipse(f.x + 1, f.y + 2, r, r * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#e63946';
                ctx.beginPath();
                ctx.arc(f.x, f.y - 1.5, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#ffccd5';
                ctx.beginPath();
                ctx.arc(f.x - 1, f.y - 2.5, 1.3, 0, Math.PI * 2);
                ctx.fill();
            }

            // 4. Telarañas
            for (let w of webs) {
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                ctx.arc(w.x, w.y, 4.5, 0, Math.PI * 2);
                ctx.stroke();
            }

            // 5. Hormigueros en relieve 2.5D
            for (let n of antNests) {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.ellipse(n.x + 4, n.y + 6, n.radius + 9, (n.radius + 9) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#582f0e';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y, n.radius + 8, (n.radius + 8) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#7f4f24';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y - 3, n.radius + 4, (n.radius + 4) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#0b0503';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y - 4, n.radius - 6, (n.radius - 6) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 6. Termiteros elevados estilo catedral de arcilla
            for (let n of termiteNests) {
                ctx.fillStyle = 'rgba(0,0,0,0.45)';
                ctx.beginPath();
                ctx.ellipse(n.x + 5, n.y + 7, n.radius + 10, (n.radius + 10) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#774936';
                ctx.beginPath();
                ctx.ellipse(n.x, n.y, n.radius + 9, (n.radius + 9) * TILT, 0, 0, Math.PI * 2);
                ctx.fill();

                // Torre central elevada
                ctx.fillStyle = '#9c6644';
                ctx.beginPath();
                ctx.ellipse(n.x - 2, n.y - 9, n.radius * 0.65, n.radius * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#2e190a';
                ctx.beginPath();
                ctx.ellipse(n.x + 4, n.y + 2, 5.5, 4, 0, 0, Math.PI * 2);
                ctx.ellipse(n.x - 7, n.y + 3, 4.5, 3.5, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // 7. Ordenar entidades por eje Y (Depth Sorting) para perspectiva 2.5D realista
            let allEntities = [...ants, ...termites, ...beetles, ...enemies];
            allEntities.sort((a, b) => a.y - b.y);
            for (let ent of allEntities) ent.draw();

            // 8. Partículas de combate
            for (let pt of particles) {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.life / pt.maxLife;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1.0;

            // 9. Copas de árboles y arbustos
            drawCanopyLayer();

            // 10. Iluminación cálida del bosque (Wild Forest Atmosphere)
            let sunGrad = ctx.createRadialGradient(canvas.width * 0.3, canvas.height * 0.2, 100, canvas.width * 0.5, canvas.height * 0.5, canvas.width * 0.8);
            sunGrad.addColorStop(0, 'rgba(255, 243, 176, 0.08)');
            sunGrad.addColorStop(1, 'rgba(6, 15, 5, 0.32)');
            ctx.fillStyle = sunGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 11. Previsualización del cursor en perspectiva
            const validPlacement = canPlaceAt(mousePos.x, mousePos.y, currentTool);
            const previewRadius = (currentTool === 'nest' || currentTool === 'termite_nest') ? 28 : (currentTool === 'mantis') ? 22 : (currentTool === 'spider' || currentTool === 'beetle') ? 16 : 14;

            ctx.strokeStyle = validPlacement ? 'rgba(181, 228, 140, 0.95)' : 'rgba(255, 77, 109, 0.98)';
            ctx.fillStyle = validPlacement ? 'rgba(181, 228, 140, 0.2)' : 'rgba(255, 77, 109, 0.3)';
            ctx.setLineDash([5, 4]);
            ctx.lineWidth = 2.2;
            ctx.beginPath();
            ctx.ellipse(mousePos.x, mousePos.y, previewRadius, previewRadius * TILT, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.setLineDash([]);

            requestAnimationFrame(loop);
        }

        init();
        loop();
    </script>
</body>

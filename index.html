<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colonia de Hormigas - Bosque</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #1b2418;
            color: #eef5db;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 { font-size: 1.6rem; color: #a7c957; }
        #status-msg {
            font-size: 0.95rem;
            color: #f2e8cf;
            background: #386641;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 5px;
            font-weight: bold;
        }
        
        .hud {
            display: flex;
            gap: 15px;
            background: #283623;
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #4f6d45;
            margin-bottom: 12px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .stat { font-weight: bold; font-size: 1rem; }
        .stat span { color: #a7c957; }
        
        button {
            background-color: #6a994e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }
        button:hover { background-color: #82b862; }
        button:active { transform: scale(0.96); }
        button:disabled {
            background-color: #465441;
            color: #84967d;
            cursor: not-allowed;
        }
        .btn-danger { background-color: #bc4749; }
        .btn-danger:hover { background-color: #d65a5c; }

        canvas {
            background-color: #4a7c36;
            border: 4px solid #314928;
            border-radius: 10px;
            cursor: crosshair;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            max-width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌿 Colonia de Hormigas</h1>
        <div id="status-msg">📍 Haz clic en el césped para fundar tu hormiguero</div>
    </header>

    <div class="hud">
        <div class="stat">🍓 Comida: <span id="food-count">20</span></div>

        <button id="btn-spawn-ant" disabled>Crear Hormiga (10 🍓)</button>
        <button id="btn-speed">Velocidad: 1x</button>
        <button id="btn-clear" class="btn-danger">Nuevo Mapa</button>
    </div>

    <canvas id="gameCanvas" width="850" height="520"></canvas>
